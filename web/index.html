<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minime · 个人分身知识库</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icon-256.png">
<script>
  // 主题在首屏渲染前定好，避免闪一下；默认暖色浅色（长时间看更省眼）
  try {
    if (localStorage.getItem('minime.theme') !== 'dark')
      document.documentElement.classList.add('light');
  } catch (e) {
    document.documentElement.classList.add('light');
  }
</script>
<style>
  /* ============================================================
     设计系统：暖色专业工具
     原则：暖褐/米色面、无发光无渐变、细边框、方角、只用文字层级表达结构
     两套主题共用同一组语义变量：暖色深（默认） / 暖色浅（纸张感）
     ============================================================ */
  :root{
    /* 面：中性炭灰（只带极轻微暖调，不再是棕色），靠边框而不是阴影分层 */
    --bg:#141517;
    --surface-1:#1B1C1F;
    --surface-2:#232427;
    --surface-3:#2C2D31;
    /* 边框 */
    --line:#303136;
    --line-strong:#3F4046;
    --line-hover:#51525A;
    /* 文字 */
    --fg:#EFEFF1;
    --fg-2:#CFD0D4;
    --fg-3:#A3A4AA;
    --fg-4:#8E8F96;
    /* 强调色：琥珀，只在选中/链接上出现，不铺满整个界面 */
    --acc:#E0A458;
    --acc-bg:#2B2C33;
    --acc-fg-soft:#F0CC93;
    /* 主操作按钮 */
    --cta-bg:#E0A458; --cta-hover:#EDBA74; --cta-fg:#1E1508;
    /* 语义色 */
    --ok:#7EBE8A;
    --warn:#D9B45C;
    --bad:#D9776F;
    /* 辅助面 */
    --sel:#3B3D45;
    --scroll:#3F4046;
    --scroll-hover:#51525A;
    --knob-on:#141517;
    --mask:#000000C9;
    --shadow-md:0 4px 16px #0007;
    --shadow-lg:0 12px 40px #000B;
    /* 知识类型标签：中性底上用有区分的色相 */
    --k-decision:#C6A9D8; --k-decision-b:#544362;
    --k-preference:#9FB6E0; --k-preference-b:#3D4A63;
    --k-troubleshooting:#DE9A93; --k-troubleshooting-b:#5C3B38;
    --k-pattern:#8FC49E; --k-pattern-b:#3B5243;
    --k-fact:#A3A4AA; --k-fact-b:#3F4046;
    --k-event:#D7BC73; --k-event-b:#564A2A;
    --k-insight:#8CC0C6; --k-insight-b:#35504F;
    /* 圆角：只保留 4 / 6 */
    --r-sm:4px; --r-md:6px;
    /* 动效：只做颜色过渡，不做位移与缩放 */
    --t:120ms ease;
    /* 让原生控件（复选框、滚动条、下拉）跟随主题 */
    color-scheme: dark;
  }
  /* ---- 暖色浅主题：纸张感，低疲劳 ---- */
  html.light{
    --bg:#F7F2EA;
    --surface-1:#FFFCF8;
    --surface-2:#F3ECE2;
    --surface-3:#EAE0D3;
    --line:#E4D8C8;
    --line-strong:#D0C0AB;
    --line-hover:#B9A691;
    --fg:#2A2119;
    --fg-2:#4A3D31;
    --fg-3:#6E6053;
    --fg-4:#7A6B5A;
    --acc:#A85E17;
    --acc-bg:#F8EADA;
    --acc-fg-soft:#8A4E12;
    --cta-bg:#9E5617; --cta-hover:#87470F; --cta-fg:#FFFFFF;
    --ok:#3F6630;
    --warn:#8F6A14;
    --bad:#B2453C;
    --sel:#EBD7BE;
    --scroll:#D0C0AB;
    --scroll-hover:#B9A691;
    --knob-on:#FFFFFF;
    --mask:#4A3828A6;
    --shadow-md:0 2px 10px #7A64471F;
    --shadow-lg:0 12px 32px #7A644729;
    --k-decision:#6B4A75; --k-decision-b:#DCCBE0;
    --k-preference:#7A5A2E; --k-preference-b:#EBDCC4;
    --k-troubleshooting:#8C4038; --k-troubleshooting-b:#F0D2CC;
    --k-pattern:#4A5C33; --k-pattern-b:#DCE5CC;
    --k-fact:#6B5D50; --k-fact-b:#E4DAD0;
    --k-event:#7A6320; --k-event-b:#EFE3C4;
    --k-insight:#33564F; --k-insight-b:#CFE0DD;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",
      "Microsoft YaHei",system-ui,sans-serif;
    color:var(--fg);background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--sel);color:var(--fg)}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:3px solid transparent;
    background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover);background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------------- 顶栏 ---------------- */
  header{
    display:flex;align-items:center;gap:22px;padding:0 20px;height:48px;
    background:var(--surface-1);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  header h1{
    font-size:13px;margin:0;font-weight:600;letter-spacing:0;color:var(--fg);
    white-space:nowrap;display:flex;align-items:center;gap:7px;
  }
  .logo-mark{color:var(--fg-2);flex:none}
  nav{display:flex;gap:1px;flex:1;min-width:0}
  .nav-scroll{display:flex;gap:1px;flex:0 1 auto;min-width:0;overflow-x:auto;
    scrollbar-width:none}
  .nav-scroll::-webkit-scrollbar{display:none}
  nav button{
    background:transparent;border:0;color:var(--fg-3);padding:0 10px;height:30px;
    border-radius:var(--r-sm);cursor:pointer;font:inherit;font-size:12.5px;
    white-space:nowrap;transition:background var(--t),color var(--t);
  }
  nav button:hover{color:var(--fg);background:var(--surface-2)}
  nav button.on{color:var(--fg);background:var(--surface-3)}
  nav button:focus-visible{outline:1px solid var(--acc);outline-offset:1px}
  /* 次要项默认收起，展开后在导航行内就地铺开 */
  .nav-extra{display:none}
  nav.more-open .nav-extra{display:contents}
  nav button.nav-more{color:var(--fg-4);gap:4px}
  nav button.nav-more:hover{color:var(--fg-2)}
  nav button.nav-more .caret{font-size:8px;transition:transform var(--t)}
  nav.more-open button.nav-more{color:var(--fg-2)}
  nav.more-open button.nav-more .caret{transform:rotate(180deg)}

  /* ---------------- 按钮：一律方角细边框，主操作靠实心填充区分 ---------------- */
  button{
    font:inherit;font-size:12px;line-height:1;font-weight:500;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:0 11px;height:28px;border-radius:var(--r-sm);cursor:pointer;
    background:var(--surface-2);border:1px solid var(--line-strong);color:var(--fg-2);
    transition:background var(--t),border-color var(--t),color var(--t);
    white-space:nowrap;user-select:none;
  }
  button:hover{background:var(--surface-3);border-color:var(--line-hover);color:var(--fg)}
  button:focus-visible{outline:1px solid var(--acc);outline-offset:1px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--cta-bg);border-color:var(--cta-bg);color:var(--cta-fg);
    font-weight:600}
  button.primary:hover{background:var(--cta-hover);border-color:var(--cta-hover);color:var(--cta-fg)}
  button.danger{background:transparent;border-color:var(--line-strong);color:var(--bad)}
  button.danger:hover{background:var(--bad);border-color:var(--bad);color:#fff}
  button.ghost{background:transparent;border-color:transparent;color:var(--fg-3)}
  button.ghost:hover{background:var(--surface-2);border-color:transparent;color:var(--fg)}
  button.sm{height:24px;padding:0 9px;font-size:11.5px}
  button.icon{width:28px;padding:0;font-size:13px}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);
    overflow:hidden;background:var(--surface-2)}
  .seg button{border:0;border-radius:0;background:transparent;height:26px;padding:0 10px;
    font-size:11.5px;color:var(--fg-3)}
  .seg button+button{border-left:1px solid var(--line-strong)}
  .seg button.on{background:var(--surface-3);color:var(--fg);font-weight:600}
  a{color:var(--acc);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------------- 表单 ---------------- */
  input[type=text],input[type=number],input[type=password],input[type=search],textarea,select{
    background:var(--bg);border:1px solid var(--line-strong);color:var(--fg);
    border-radius:var(--r-sm);padding:0 9px;font:inherit;font-size:12.5px;height:28px;
    transition:border-color var(--t);width:auto;
  }
  textarea{padding:7px 9px;height:auto;line-height:1.6}
  input:hover,textarea:hover,select:hover{border-color:var(--line-hover)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
  input::placeholder,textarea::placeholder{color:var(--fg-4)}
  input[type=checkbox]{width:14px;height:14px;accent-color:var(--acc);cursor:pointer;margin:0}
  select{cursor:pointer;padding-right:24px;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),
                     linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);
    background-position:calc(100% - 13px) 12px, calc(100% - 9px) 12px;
    background-size:4px 4px,4px 4px;background-repeat:no-repeat}

  /* ---------------- 布局 ---------------- */
  .stat{color:var(--fg-3);font-size:11.5px;display:flex;gap:16px;align-items:center;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat b{color:var(--fg-2);font-weight:600}
  main{display:grid;grid-template-columns:248px minmax(0,1fr);height:calc(100vh - 48px)}
  body.chat-mode main{grid-template-columns:1fr;padding:0 18px 14px}
  body.chat-mode section{max-width:none;padding-left:0;padding-right:0}
  body.chat-mode aside{display:none}
  aside{border-right:1px solid var(--line);overflow:auto;padding:16px 14px;background:var(--bg)}
  section{overflow:auto;padding:20px 24px 40px;max-width:1360px}
  h2{font-size:15px;margin:0 0 3px;font-weight:600;letter-spacing:0;
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .tabs-hint{font-size:12px;color:var(--fg-3);font-weight:400}
  .empty{color:var(--fg-3);text-align:center;padding:56px 0;font-size:13px}

  /* ---------------- 后台任务横幅 ---------------- */
  #jobbar:not(:empty){height:auto}
  #jobbar:not(:empty) ~ main{height:calc(100vh - 88px)}
  .jobbanner{display:flex;align-items:center;gap:12px;padding:7px 20px;
    background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12px;
    color:var(--fg-2)}
  .jobbanner .bar{flex:0 0 180px;margin:0;height:4px}
  .jobbanner b{color:var(--fg)}

  /* ---------------- 进度条：纯色，无渐变 ---------------- */
  .bar{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--fg-3);transition:width .4s ease}
  .pbar{height:6px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin:8px 0}
  .pbar i{display:block;height:100%;background:var(--acc);transition:width .4s ease}

  /* ---------------- 卡片：靠边框分层，无阴影无悬停位移 ---------------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:1px;
    margin-bottom:18px;background:var(--line);border:1px solid var(--line);
    border-radius:var(--r-md);overflow:hidden}
  .kpi{background:var(--surface-1);padding:12px 14px}
  .kpi .kv{margin-top:2px}
  .big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px;
    line-height:1.25;color:var(--fg)}
  .card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);
    padding:14px 16px;margin-bottom:12px}
  .card.hl{border-color:var(--line-hover)}
  .card h3{margin:0 0 10px;font-size:13px;font-weight:600;
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:12px;align-items:start}
  .cards .card{margin-bottom:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .jobrow{display:grid;grid-template-columns:110px 1fr 190px 150px;gap:12px;font-size:12px;
    padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
  .srcrow{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;
    margin-bottom:6px;font-size:12px}
  .proj-row{display:grid;grid-template-columns:150px 1fr 46px;gap:12px;align-items:center;margin-bottom:9px}
  .proj-row span:first-child{font-size:12px;color:var(--fg-2);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .kv{font-size:12px;color:var(--fg-3)} .kv b{color:var(--fg-2)}
  .kvrow{display:grid;grid-template-columns:100px 1fr;gap:10px;font-size:12px;margin-bottom:5px}
  .kvrow span:first-child{color:var(--fg-4)}
  .score{font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:0 5px;border-radius:2px;font-size:10.5px;
    border:1px solid var(--line-strong);color:var(--fg-3)}
  .pill.warn{color:var(--warn);border-color:var(--warn)}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px}

  /* ---------------- 侧栏筛选 ---------------- */
  .side-empty{padding:16px 2px}
  .side-empty-t{font-size:11px;letter-spacing:.6px;color:var(--fg-3);
    font-weight:600;margin-bottom:8px}
  .dim{margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .dim:last-child{border-bottom:0}
  .dim-head{display:flex;align-items:center;justify-content:space-between;width:100%;
    background:none;border:0;height:auto;padding:6px 0;margin:0;text-align:left;
    font-size:11px;letter-spacing:.6px;color:var(--fg-3);font-weight:600;cursor:pointer}
  .dim-head:hover{color:var(--fg);background:none}
  .dim.open .dim-head span:first-child{color:var(--acc)}
  .dim-head .arrow{font-size:8px;color:var(--fg-4);transition:transform var(--t)}
  .dim.open .dim-head .arrow{transform:rotate(90deg);color:var(--acc)}
  .dim-body{display:none;padding:2px 0 8px}
  .dim.open .dim-body{display:block}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:var(--r-sm);
    background:transparent;border:1px solid var(--line-strong);margin:0 4px 5px 0;
    cursor:pointer;font-size:11.5px;color:var(--fg-2);
    transition:background var(--t),border-color var(--t),color var(--t)}
  .chip:hover{border-color:var(--line-hover);color:var(--fg)}
  .chip.on{background:var(--acc-bg);color:var(--acc-fg-soft);border-color:var(--acc)}
  .chip small{color:var(--fg-3);font-size:10.5px;margin-left:3px;
    font-variant-numeric:tabular-nums}

  /* ---------------- 搜索与筛选条 ---------------- */
  .search{display:flex;gap:8px;margin-bottom:14px}
  .search input[type=search]{flex:1;height:34px;font-size:13px}
  .search input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;
    appearance:none}
  .search input[type=search]::-ms-clear{display:none}
  .filterbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-6px 0 14px}
  .fbar-label{font-size:11px;color:var(--fg-3);letter-spacing:.5px;margin-right:2px}
  .fchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
    border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:2px 4px 2px 8px;
    color:var(--fg-2);background:var(--surface-2)}
  .fchip button{width:16px;min-width:16px;height:16px;padding:0;font-size:11px;line-height:1;
    background:transparent;border:0;color:var(--fg-3);border-radius:2px}
  .fchip button:hover{background:var(--surface-3);color:var(--fg)}
  .card-title{cursor:pointer}
  .card-title:hover{color:var(--acc)}
  .acts button.done{color:var(--fg-4);border-color:var(--line)}
  .sens{font-size:10px;padding:0 4px;border-radius:2px;border:1px solid var(--line-strong);
    color:var(--fg-4)}
  .sens-private{color:var(--warn);border-color:var(--warn)}
  .sens-internal{color:var(--fg-3)}

  /* ---------------- 知识浏览 ---------------- */
  .meta{font-size:11.5px;color:var(--fg-3);display:flex;gap:9px;flex-wrap:wrap;
    align-items:center;margin-bottom:7px}
  .tag{padding:1px 5px;border-radius:2px;font-size:10.5px;font-weight:600;
    border:1px solid;background:transparent}
  .k-decision{color:var(--k-decision);border-color:var(--k-decision-b)}
  .k-preference{color:var(--k-preference);border-color:var(--k-preference-b)}
  .k-troubleshooting{color:var(--k-troubleshooting);border-color:var(--k-troubleshooting-b)}
  .k-pattern{color:var(--k-pattern);border-color:var(--k-pattern-b)}
  .k-fact{color:var(--k-fact);border-color:var(--k-fact-b)}
  .k-event{color:var(--k-event);border-color:var(--k-event-b)}
  .k-insight{color:var(--k-insight);border-color:var(--k-insight-b)}
  .body{white-space:pre-wrap;color:var(--fg-2);font-size:12.5px;max-height:66px;
    overflow:hidden;position:relative;word-break:break-word;line-height:1.7}
  .body::after{content:"";position:absolute;bottom:0;left:0;right:0;height:26px;
    background:linear-gradient(transparent,var(--surface-1))}
  .src{font-size:11px;color:var(--fg-3);margin-top:6px}
  .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
  .acts button.ok:hover{color:var(--ok);border-color:var(--ok)}
  .acts button.no:hover{color:var(--bad);border-color:var(--bad)}
  .acts button[data-ev="accepted"]{color:var(--ok)}
  .taglist{margin-top:5px}
  .taglist .chip{cursor:default;font-size:11px;color:var(--fg-3);border-color:var(--line)}

  /* ---------------- 详情抽屉 ---------------- */
  .drawer{position:fixed;right:0;top:48px;bottom:0;width:min(600px,94vw);
    background:var(--surface-1);border-left:1px solid var(--line-strong);
    padding:20px 22px;overflow:auto;z-index:30}
  .drawer h3{margin:0 0 12px;font-size:15px;font-weight:600;padding-right:40px;line-height:1.45}
  .drawer pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13px;
    color:var(--fg-2);margin:0;line-height:1.75}
  .drawer .close{position:absolute;right:14px;top:14px;background:transparent;
    border:1px solid var(--line-strong);color:var(--fg-3);border-radius:var(--r-sm);
    width:26px;height:26px;padding:0;cursor:pointer;font-size:13px}

  /* ---------------- 对话 ---------------- */
  .chat-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px;
    height:calc(100vh - 96px)}
  .chat-list{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);
    padding:8px;overflow:auto}
  .chat-item{padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;margin-bottom:1px;
    font-size:12.5px;display:flex;align-items:center;gap:8px;color:var(--fg-2);
    transition:background var(--t),color var(--t)}
  .chat-item:hover{background:var(--surface-2);color:var(--fg)}
  .chat-item.on{background:var(--acc-bg);color:var(--acc-fg-soft)}
  .chat-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat-item .del{opacity:0;color:var(--fg-3);font-size:13px;line-height:1;padding:0 2px;
    background:none;border:0;height:auto}
  .chat-item:hover .del{opacity:1}
  .chat-item .del:hover{color:var(--bad);background:none}
  .chat-main{display:flex;flex-direction:column;min-height:0;background:var(--surface-1);
    border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
  .chat-head{display:flex;align-items:center;gap:10px;padding:11px 16px;
    border-bottom:1px solid var(--line)}
  .chat-head .ttl{font-size:13px;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .chat-body{flex:1;overflow:auto;padding:20px 22px;scroll-behavior:smooth}
  .msg{display:flex;gap:10px;margin-bottom:18px;align-items:flex-start}
  .msg .avatar{flex:0 0 auto;height:20px;padding:0 6px;border-radius:2px;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
    margin-top:2px;border:1px solid var(--line-strong);color:var(--fg-3)}
  .msg.assistant .avatar{color:var(--fg-2);background:var(--surface-2)}
  .msg .bubble{flex:1;min-width:0}
  .msg .text{white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.8;
    color:var(--fg-2);max-width:76ch}
  .msg.user .text{color:var(--fg)}
  .msg .refs{margin-top:10px;display:flex;flex-direction:column;gap:1px;max-width:76ch;
    border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
  .msg .text code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;
    background:var(--surface-2);border:1px solid var(--line-strong);border-radius:2px;
    padding:0 4px;color:var(--acc-fg-soft)}
  .msg .text strong{color:var(--fg);font-weight:600}
  .md-h{font-weight:600;color:var(--fg);margin:10px 0 3px}
  .md-li{padding-left:14px;text-indent:-14px;color:var(--fg-2)}
  .md-li::before{content:"–";color:var(--fg-4);margin-right:6px}
  .md-ol{padding-left:18px;text-indent:-18px}
  .md-ol::before{content:"";}
  .md-cite{color:var(--fg-3);font-size:11px;font-weight:600}
  .ref{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--fg-3);
    background:var(--bg);padding:6px 10px;cursor:pointer;
    border-bottom:1px solid var(--line);transition:background var(--t),color var(--t)}
  .ref:last-child{border-bottom:0}
  .ref:hover{background:var(--surface-2);color:var(--fg-2)}
  .ref .n{color:var(--fg-3);font-weight:600}
  .chat-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;
    align-items:flex-end}
  .chat-foot textarea{flex:1;resize:none;min-height:44px;max-height:170px;line-height:1.6;
    padding:9px 11px;border-radius:var(--r-sm)}
  .typing{display:inline-flex;gap:5px;align-items:center;color:var(--fg-3);font-size:12.5px}
  .typing i{width:4px;height:4px;border-radius:50%;background:var(--fg-4);
    animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}
  .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .chat-empty{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;color:var(--fg-3);text-align:center;padding:20px}
  .chat-empty .prompts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
    max-width:560px}

  /* ---------------- 新手引导 ---------------- */
  .guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;
    margin-bottom:14px}
  .guide .step{position:relative;background:var(--surface-1);border:1px solid var(--line);
    border-radius:var(--r-md);padding:13px 15px}
  .guide .step.done{border-color:var(--ok)}
  .guide .step .no{position:absolute;right:13px;top:11px;font-size:11px;color:var(--fg-4)}
  .guide .step h4{margin:0 0 5px;font-size:12.5px;font-weight:600;
    display:flex;align-items:center;gap:6px}
  .guide .step p{margin:0 0 8px;font-size:11.5px;color:var(--fg-3);line-height:1.65}
  .guide .step.done h4::before{content:"✓";color:var(--ok);font-weight:600}
  .banner{display:flex;gap:14px;align-items:center;padding:11px 15px;margin-bottom:14px;
    border:1px solid var(--line-strong);background:var(--surface-1);
    border-radius:var(--r-md);font-size:12.5px}
  .banner .txt{flex:1;line-height:1.7;color:var(--fg-2)}

  /* ---------------- 图谱 / 图例 ---------------- */
  #graph{display:block;width:100%;height:calc(100vh - 48px);cursor:grab}
  #graph.grabbing{cursor:grabbing}
  #graph.pointing{cursor:pointer}
  .legend{position:absolute;right:16px;bottom:14px;background:var(--surface-1);
    border:1px solid var(--line-strong);border-radius:var(--r-md);padding:9px 12px;
    font-size:11.5px;color:var(--fg-3);line-height:1.9}
  .graph-wrap{position:relative;height:100%}
  .gp{position:absolute;left:16px;top:14px;width:min(330px,48vw);
    max-height:calc(100% - 28px);overflow:auto;background:var(--surface-1);
    border:1px solid var(--line-strong);border-radius:var(--r-md);padding:12px 13px;z-index:6}
  .gp[hidden]{display:none}
  .gp-head{display:flex;align-items:center;gap:8px}
  .gp-type{font-size:10.5px;color:var(--fg-3);border:1px solid var(--line-strong);
    border-radius:2px;padding:1px 5px}
  .gp-close{margin-left:auto;background:none;border:0;padding:0 2px;height:auto;
    color:var(--fg-3);font-size:13px;line-height:1}
  .gp-close:hover{background:none;color:var(--fg)}
  .gp h3{margin:8px 0 5px;font-size:14.5px;font-weight:600;line-height:1.45;
    word-break:break-word}
  .gp-sec{margin:14px 0 4px;font-size:11px;color:var(--fg-4)}
  .gp-rel{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
    background:none;border:0;border-radius:var(--r-sm);padding:5px 6px;height:auto;
    color:var(--fg-2)}
  .gp-rel:hover{background:var(--surface-2);color:var(--fg)}
  .gp-rel .rel{flex:0 0 auto;font-size:11px;color:var(--fg-4)}
  .gp-rel .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:12.5px}
  .gp-rel .wt{font-size:11px;color:var(--fg-4)}
  .gp-atom{display:flex;align-items:flex-start;gap:7px;width:100%;text-align:left;
    background:none;border:0;border-radius:var(--r-sm);padding:5px 6px;height:auto;
    color:var(--fg-2);font-size:12.5px;line-height:1.5}
  .gp-atom:hover{background:var(--surface-2);color:var(--fg)}
  .gp-atom .tag{margin-top:1px;flex:0 0 auto}
  .gp-more{width:100%;margin-top:8px;background:none;border:1px solid var(--line-strong);
    color:var(--fg-2);height:auto;padding:6px 8px;font-size:12px;border-radius:var(--r-sm)}
  .gp-more:hover{border-color:var(--line-hover);background:var(--surface-2)}

  /* ---------------- 轻提示 / 弹层 / 骨架屏 ---------------- */
  #toasts{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;
    flex-direction:column;gap:8px;align-items:flex-end}
  .toast{background:var(--surface-3);border:1px solid var(--line-strong);
    border-left:2px solid var(--fg-3);border-radius:var(--r-sm);padding:9px 13px;
    font-size:12.5px;color:var(--fg-2);max-width:380px;box-shadow:var(--shadow-md);
    transition:opacity 200ms}
  .toast.ok{border-left-color:var(--ok)}
  .toast.error{border-left-color:var(--bad)}
  .toast.warn{border-left-color:var(--warn)}
  .toast.out{opacity:0}
  .modal-mask{position:fixed;inset:0;background:var(--mask);z-index:70;display:flex;
    align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--surface-1);border:1px solid var(--line-strong);
    border-radius:var(--r-md);padding:18px 20px;width:min(440px,100%);
    box-shadow:var(--shadow-lg)}
  .modal-t{font-size:13.5px;font-weight:600;margin-bottom:8px}
  .modal-b{font-size:12.5px;color:var(--fg-3);line-height:1.7;margin-bottom:16px}
  .modal-input{width:100%;margin-bottom:16px}
  .modal-f{display:flex;justify-content:flex-end;gap:8px}
  .skeleton{padding:6px 0}
  .sk-bar{height:10px;background:var(--surface-2);border-radius:2px;margin-bottom:10px;
    animation:skPulse 1.4s ease-in-out infinite}
  .sk-bar.w40{width:40%} .sk-bar.w70{width:70%}
  .sk-card{height:74px;background:var(--surface-1);border:1px solid var(--line);
    border-radius:var(--r-md);margin-bottom:10px;animation:skPulse 1.4s ease-in-out infinite}
  @keyframes skPulse{0%,100%{opacity:.5}50%{opacity:1}}

  /* ---------------- 设置 ---------------- */
  .cfg-row{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:center}
  .cfg-label{color:var(--fg-3);font-size:12px;line-height:1.5;display:flex;gap:6px;
    align-items:center;flex-wrap:wrap;min-width:0}
  .cfg-bar{position:sticky;top:-20px;z-index:12;display:flex;align-items:center;gap:8px;
    flex-wrap:wrap;padding:10px 0;margin:0 0 14px;background:var(--bg);
    border-bottom:1px solid var(--line)}
  .cfg-bar .spacer{flex:1}
  .cfg-group{background:var(--surface-1);border:1px solid var(--line);
    border-radius:var(--r-md);padding:13px 16px;margin-bottom:12px}
  .cfg-group h3{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;
    align-items:baseline;gap:8px;flex-wrap:wrap}
  .cfg-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    column-gap:28px}
  .cfg-field{display:grid;grid-template-columns:148px minmax(0,1fr);column-gap:12px;
    align-items:start;padding:8px 0;border-top:1px solid var(--line);min-width:0}
  .cfg-field.span2{grid-column:1/-1}
  .cfg-field .cfg-label{padding-top:6px}
  .cfg-ctl{display:flex;align-items:center;gap:8px;min-width:0;min-height:28px}
  .cfg-ctl input[type=text],.cfg-ctl input[type=number]{width:100%;max-width:520px}
  .cfg-ctl input[type=checkbox]{width:15px;height:15px;flex:none}
  .cfg-ctl textarea{width:100%;resize:vertical;min-height:56px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
  .cfg-hint{grid-column:2;font-size:11px;color:var(--fg-4);line-height:1.6;margin-top:3px}

  /* ---------------- 资源包 ---------------- */
  .pk-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .pk-card{border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px;
    background:var(--bg)}
  .pk-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
  .pk-title{font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center;
    flex-wrap:wrap}
  .pk-badge{font-size:10.5px;padding:0 5px;border-radius:2px;font-weight:500;
    background:transparent;color:var(--fg-3);border:1px solid var(--line-strong);
    white-space:nowrap;line-height:16px}
  .pk-badge.mine{color:var(--fg-2);border-color:var(--line-hover)}
  .pk-badge.imported{color:var(--warn);border-color:var(--warn)}
  .pk-badge.on{color:var(--acc-fg-soft);border-color:var(--acc);background:var(--acc-bg)}
  .pk-badge.off{color:var(--fg-4)}
  .pk-colls{margin-top:10px;display:flex;flex-direction:column;gap:1px;
    border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
  .pk-coll{display:flex;align-items:center;gap:10px;padding:7px 10px;
    background:var(--surface-1);border-bottom:1px solid var(--line)}
  .pk-coll:last-child{border-bottom:0}
  .pk-coll:hover{background:var(--surface-2)}
  .pk-coll-name{font-size:12.5px;color:var(--fg-2)}
  /* 开关：方角，开启时填琥珀，不做发光 */
  .pk-switch{position:relative;display:inline-block;width:28px;height:16px;flex:none}
  /* input 铺满整个开关：视觉隐藏但可聚焦、可读屏、键盘空格能切换 */
  .pk-switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;
    margin:0;cursor:pointer}
  .pk-slider{position:absolute;inset:0;background:var(--surface-3);border:1px solid var(--line-strong);
    border-radius:3px;cursor:pointer;transition:background var(--t),border-color var(--t)}
  .pk-slider:before{content:"";position:absolute;width:10px;height:10px;left:2px;top:2px;
    background:var(--fg-4);border-radius:1px;transition:transform var(--t),background var(--t)}
  .pk-switch input:checked + .pk-slider{background:var(--acc);border-color:var(--acc)}
  .pk-switch input:checked + .pk-slider:before{transform:translateX(12px);background:var(--knob-on)}
  .pk-switch input:focus-visible + .pk-slider{outline:1px solid var(--acc);outline-offset:2px}
  .pk-chips{display:flex;flex-wrap:wrap;gap:6px}
  .pk-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;
    border:1px solid var(--line-strong);border-radius:var(--r-sm);cursor:pointer;
    color:var(--fg-2);background:transparent;transition:border-color var(--t),color var(--t),
    background var(--t)}
  .pk-chip:hover{border-color:var(--line-hover);color:var(--fg)}
  .pk-chip:has(input:checked){border-color:var(--acc);background:var(--acc-bg);
    color:var(--acc-fg-soft)}
  .pk-chip input{accent-color:var(--acc)}
  .pk-attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:8px;width:100%;align-items:start}
  .pk-attr-group{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;
    background:var(--bg)}
  .pk-attr-title{font-size:10.5px;color:var(--fg-3);margin-bottom:7px;letter-spacing:.5px;
    font-weight:600}
  .pk-attr{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:3px;
    cursor:pointer;color:var(--fg-2)}
  .pk-attr:hover{color:var(--fg)}
  .pk-attr input{accent-color:var(--acc)}
  .pk-filter{display:flex;flex-direction:column;gap:8px}

  /* ---------------- 表格 ---------------- */
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead th{color:var(--fg-3);text-align:left;font-weight:600;font-size:11px;
    padding:7px 6px;border-bottom:1px solid var(--line-strong)}
  tbody td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  .logrow{cursor:pointer}

  /* ---------------- 响应式 ---------------- */
  @media (max-width:1100px){
    main{grid-template-columns:212px minmax(0,1fr)}
    section{padding:18px}
    .cfg-bar{top:-18px}
    .cfg-fields{grid-template-columns:1fr}
    /* 给导航腾空间：缩小间距与按钮内边距，避免主项被挤进滚动区 */
    header{gap:14px}
    nav button{padding:0 8px}
  }
  @media (max-width:860px){
    main{grid-template-columns:1fr;height:auto}
    aside{border-right:0;border-bottom:1px solid var(--line)}
    .chat-wrap{grid-template-columns:1fr}
    .chat-list{max-height:150px}
    .grid2{grid-template-columns:1fr}
    .cards{grid-template-columns:1fr}
    .stat{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<script>


const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const state = {view:'atoms', q:'', project:'', tech:'', facet:'', kind:'', status:'',
  limit:40, sideOpen:'kind'};
let FACETS = {};

const KIND_CN = {decision:'决策',preference:'偏好',fact:'事实',troubleshooting:'排障',
  pattern:'模式',event:'事件',insight:'洞察'};
const DIM_CN = {project:'项目', tech:'技术', scene:'场景', topic:'主题', activity:'活动'};
const STATE_CN = {active:'正常', dormant:'已降权', superseded:'已取代', archived:'已归档'};
const FB_CN = {accepted:'已采用', cited:'已引用', rejected:'已标记不相关',
  verified:'已核实', corrected:'已纠正'};
const VIEW_CN = {chat:'对话', progress:'处理进度', atoms:'知识浏览', graph:'知识图谱',
  profile:'能力画像', workspaces:'工作区', collectors:'采集源', packs:'资源包',
  logs:'运行日志', settings:'设置', archive:'归档'};

// 统一请求：网络异常/非 2xx 都转成 {error}，调用方只处理一种形态
async function get(url){
  try {
    const r = await fetch(url);
    const j = await r.json().catch(() => ({}));
    if (!r.ok && !j.error) j.error = `HTTP ${r.status}`;
    return j;
  } catch (e) {
    return {error: '面板连接中断，请确认 minime web 仍在运行'};
  }
}
async function post(url, body){
  try {
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok && !j.error) j.error = `HTTP ${r.status}`;
    return j;
  } catch (e) {
    return {error: '面板连接中断，请确认 minime web 仍在运行'};
  }
}

function fmtN(n){ return n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : n; }
function fmtT(ts){ return ts ? new Date(ts*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—'; }
function fmtSize(b){
  if (b >= 1024**3) return (b/1024**3).toFixed(2)+' GB';
  if (b >= 1024**2) return (b/1024**2).toFixed(2)+' MB';
  if (b >= 1024) return (b/1024).toFixed(0)+' KB';
  return b+' B';
}
function fmtDur(s){
  if (s == null) return '—';
  if (s < 60) return `${Math.round(s)} 秒`;
  if (s < 3600) return `${Math.round(s/60)} 分钟`;
  if (s < 86400) return `${(s/3600).toFixed(s % 3600 ? 1 : 0)} 小时`;
  return `${(s/86400).toFixed(s % 86400 ? 1 : 0)} 天`;
}

// ---------------- 主题：暖色深 / 暖色浅，切换写入 localStorage
function isLight(){ return document.documentElement.classList.contains('light'); }
function syncThemeBtn(){
  const b = $('#theme-btn');
  if (b) b.textContent = isLight() ? '深色' : '浅色';
}
function setTheme(light){
  document.documentElement.classList.toggle('light', light);
  try { localStorage.setItem('minime.theme', light ? 'light' : 'dark'); } catch (e) {}
  syncThemeBtn();
  if (state.view === 'graph') routeView();   // 图谱是 canvas，靠重绘跟随主题
  toast(light ? '已切到浅色' : '已切到深色', 'ok');
}
// canvas 取不到 CSS 变量，这里手动读一次
function cssVar(name){
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}

// ---------------- 轻提示：替代 alert，右下角堆叠，3.4 秒自散
function toast(msg, kind='info'){
  let box = $('#toasts');
  if (!box){ box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 200); }, 3400);
}

// ---------------- 确认弹层：替代 confirm，支持危险操作与补充说明
function confirmBox({title, text='', ok='确定', danger=false}){
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-mask';
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <div class="modal-t">${esc(title)}</div>
      ${text ? `<div class="modal-b">${text}</div>` : ''}
      <div class="modal-f">
        <button data-no>取消</button>
        <button class="${danger?'danger':'primary'}" data-yes>${esc(ok)}</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const done = v => { wrap.remove(); document.removeEventListener('keydown', key); resolve(v); };
    const key = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', key);
    wrap.querySelector('[data-no]').onclick = () => done(false);
    wrap.querySelector('[data-yes]').onclick = () => done(true);
    wrap.onclick = e => { if (e.target === wrap) done(false); };
    wrap.querySelector('[data-yes]').focus();
  });
}

// ---------------- 行内输入弹层：替代 prompt
function promptBox({title, value='', placeholder='', ok='确定'}){
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-mask';
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <div class="modal-t">${esc(title)}</div>
      <input type="text" class="modal-input" value="${esc(value)}" placeholder="${esc(placeholder)}">
      <div class="modal-f"><button data-no>取消</button>
        <button class="primary" data-yes>${esc(ok)}</button></div></div>`;
    document.body.appendChild(wrap);
    const inp = wrap.querySelector('.modal-input');
    const done = v => { wrap.remove(); document.removeEventListener('keydown', key); resolve(v); };
    const key = e => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', key);
    inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); done(inp.value.trim() || null); } };
    wrap.querySelector('[data-no]').onclick = () => done(null);
    wrap.querySelector('[data-yes]').onclick = () => done(inp.value.trim() || null);
    wrap.onclick = e => { if (e.target === wrap) done(null); };
    inp.focus(); inp.select();
  });
}

// ---------------- 按钮忙态：同一按钮重复点击不会发两次请求
async function withBusy(btn, busyText, fn){
  if (!btn || btn.dataset.busy) return;
  const old = btn.textContent;
  btn.dataset.busy = '1';
  btn.disabled = true;
  btn.textContent = busyText;
  try { return await fn(); }
  finally {
    btn.disabled = false;
    btn.textContent = old;
    delete btn.dataset.busy;
  }
}

// ---------------- URL 状态：筛选条件可分享、刷新保留、前进后退可用
function syncURL(){
  const p = new URLSearchParams();
  if (state.view !== 'atoms') p.set('view', state.view);
  if (state.view === 'chat'){ if (CHAT.sid) p.set('session', CHAT.sid); }
  else for (const k of ['q','project','tech','facet','kind','status']) if (state[k]) p.set(k, state[k]);
  const s = p.toString();
  const next = s ? '?' + s : location.pathname;
  const st = {limit: state.limit};
  if (next === location.pathname + location.search) {
    history.replaceState(st, '', next);
    return;
  }
  history.pushState(st, '', next);
}
function readURL(){
  const p = new URLSearchParams(location.search);
  state.view = p.get('view') || 'atoms';
  state.q = p.get('q') || '';
  state.project = p.get('project') || '';
  state.tech = p.get('tech') || '';
  state.facet = p.get('facet') || '';
  state.kind = p.get('kind') || '';
  state.status = p.get('status') || '';
  // 后退回来时恢复「当时加载到第几条」，不然会跳回第一屏
  state.limit = (history.state && history.state.limit) || 40;
  CHAT.sid = p.get('session') || CHAT.sid;
}
// 浏览器后退/前进：按 URL 重画当前视图
window.addEventListener('popstate', () => {
  const prev = state.view;
  readURL();
  closeDrawers();

});

async function startJob(action, extra){

  const side = $('#side');

      || state.view === 'collectors' || state.view === 'packs'

  const dims = ['project','tech','scene','topic','activity'];

    key: 'kind', label: '知识类型',

      `<span class="chip ${state.kind===k?'on':''}" data-kind="${k}">${cn}</span>`).join(''),
  }];
  for (const d of dims){
    const items = FACETS[d] || [];
    if (!items.length) continue;
    const isOn = v => (d === 'project' || d === 'tech')
      ? state[d] === v : state.facet === `${d}:${v}`;
    groups.push({
      key: d, label: DIM_CN[d] || d,
      chips: items.slice(0, 18).map(x =>
        `<span class="chip ${isOn(x.value)?'on':''}" data-dim="${d}" data-val="${x.value.replace(/"/g,'&quot;')}">${x.value}<small>${x.count}</small></span>`).join(''),
    });
  }
  groups.push({
    key: 'status', label: '状态',
    chips: Object.entries(STATE_CN).map(([k, cn]) =>
      `<span class="chip ${(state.status||'active')===k?'on':''}" data-status="${k}">${cn}</span>`).join(''),
  });
  const open = state.sideOpen;
  side.innerHTML = groups.map(g => `
    <div class="dim ${open===g.key?'open':''}">
      <button class="dim-head" data-group="${g.key}" aria-expanded="${open===g.key}">
        <span>${g.label}</span><span class="arrow">▶</span>
      </button>
      <div class="dim-body">${g.chips}</div>
    </div>`).join('');
  // 手风琴：同一时间只展开一组，默认展开「知识类型」
  side.querySelectorAll('.dim-head').forEach(b => b.onclick = () => {
    state.sideOpen = state.sideOpen === b.dataset.group ? '' : b.dataset.group;
    const top = side.scrollTop;
    renderSide();
    side.scrollTop = top;
  });
  side.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    if (c.dataset.status !== undefined){
      // 「正常」不加筛选，其余状态按需切换
      const v = c.dataset.status;
      state.status = (v === 'active' || state.status === v) ? '' : v;
    } else if (c.dataset.kind !== undefined){
      state.kind = state.kind === c.dataset.kind ? '' : c.dataset.kind;
    } else {
      const d = c.dataset.dim, v = c.dataset.val;
      if (d === 'project' || d === 'tech'){
        state[d] = state[d] === v ? '' : v;
      } else {
        const f = `${d}:${v}`;
        state.facet = state.facet === f ? '' : f;
      }
    }
    state.limit = 40;
    renderSide();
    syncURL();
    loadAtoms().catch(e => viewError(e, loadAtoms));
  });
}

let ATOMS = [];

async function loadAtoms(append=false){
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);

  p.set('limit', state.limit);
  const d = await get('/api/atoms?' + p);
  if (d.error) return viewError(d.error, () => loadAtoms(append));
  const prev = append ? ATOMS.length : 0;
  ATOMS = append ? ATOMS.concat(d.items) : d.items;
  ATOMS_DONE = d.items.length < state.limit || (d.matched ?? d.count) <= ATOMS.length;
  const v = $('#view');
  const matched = d.matched ?? d.count;
  const chips = [
    state.q && ['搜索', state.q, 'q'],
    state.project && ['项目', state.project, 'project'],
    state.tech && ['技术', state.tech, 'tech'],
    state.facet && ['标签', facetLabel(state.facet), 'facet'],
    state.kind && ['类型', KIND_CN[state.kind] || state.kind, 'kind'],
    state.status && ['状态', STATE_CN[state.status] || state.status, 'status'],
  ].filter(Boolean);
  const stateNote = state.status ? `<div class="kv" style="margin:-2px 0 10px">当前只显示「${STATE_CN[state.status]||state.status}」知识：${
    state.status === 'dormant' ? '降权条目仍会在正常命中不足时被召回；点「恢复」可立即回到正常检索。'
    : state.status === 'archived' ? '归档条目不参与检索；点「恢复」可重新启用。'
    : '已取代条目保留用于追溯；点「恢复」可重新启用。'}</div>` : '';
  const head = `<h2>知识浏览 <span class="tabs-hint">「详情」查看全文、来源与评分；「采用 / 引用」提高后续检索权重，「不相关」降低权重，连续多次降权且可恢复</span></h2>
    <div class="search">
      <input type="search" id="q" placeholder="搜索标题或正文…" value="${esc(state.q)}" autocomplete="off">
      ${state.q ? '<button class="ghost" id="q-clear" title="清空搜索">清空</button>' : ''}
      <span class="kv" style="white-space:nowrap;align-self:center">命中 <b>${matched}</b> / 全库 ${d.total_atoms}</span>
    </div>
    ${chips.length ? `<div class="filterbar"><span class="fbar-label">筛选</span>${chips.map(([k, v, key]) =>
      `<span class="fchip">${esc(k)}：${esc(v)}<button data-unset="${key}" title="移除">×</button></span>`).join('')}
      <span class="kv">命中 ${matched} 条${matched === 0 ? '（条件过严，可移除一项）' : ''}</span>
      <button class="sm ghost" id="clear-flt">全部清空</button></div>` : ''}`;
  if (!ATOMS.length){
    v.innerHTML = head + stateNote + `<div class="empty">
      ${state.status ? `该状态下没有知识` : chips.length ? '当前筛选没有命中知识' : '知识库为空'}<br>
      <small>${state.status ? '切换左侧「状态 → 正常」查看全部知识' : chips.length ? '更换关键词，或移除上面的筛选条件' : '完成采集与清洗后，知识将显示在这里'}</small>
      ${chips.length ? '<div class="acts" style="justify-content:center;margin-top:12px"><button id="clear-flt2">清空筛选</button></div>'
                     : '<div class="acts" style="justify-content:center;margin-top:12px"><button class="primary" id="goto-progress">去处理进度</button></div>'}
      </div>`;
    bindAtomsHead();
    if ($('#clear-flt2')) $('#clear-flt2').onclick = clearFilters;
    if ($('#goto-progress')) $('#goto-progress').onclick = () => {
      state.view = 'progress'; syncURL(); renderView();
    };
    return;
  }
  const rest = Math.max(0, matched - ATOMS.length);
  v.innerHTML = head + stateNote + `<div class="cards">` + ATOMS.slice(prev).map(a => cardHTML(a)).join('') + `</div>`
    + (ATOMS_DONE ? `<div class="kv" style="text-align:center;padding:14px">已显示全部 ${ATOMS.length} 条</div>`
                  : `<div class="acts" style="justify-content:center;margin-top:14px">
                     <button id="more">加载更多（还有 ${rest} 条）</button></div>`);
  bindCards();
  bindAtomsHead();
  if ($('#more')) $('#more').onclick = e => withBusy(e.target, '加载中…', async () => {
    state.limit += 40;
    history.replaceState({limit: state.limit}, '', location.href);
    await loadAtoms(true);
    // 把视口挪到新追加的第一条，接着往下看而不用重新找位置
    const first = $$('.cards .card')[prev];
    if (first) first.scrollIntoView({block:'start', behavior:'smooth'});
  });
}

function bindAtomsHead(){
  const q = $('#q');
  if (q){
    q.oninput = () => {
      clearTimeout(ATOMS_SEARCH_TIMER);
      ATOMS_SEARCH_TIMER = setTimeout(() => {
        state.q = q.value.trim(); state.limit = 40;
        syncURL();
        loadAtoms().catch(e => viewError(e, loadAtoms)).then(() => {
          const nq = $('#q'); if (nq){ nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); }
        });
      }, 260);
    };
    q.onkeydown = e => {
      if (e.key === 'Escape' && q.value){ q.value = ''; q.oninput(); }
    };
  }
  const qc = $('#q-clear');
  if (qc) qc.onclick = () => { state.q = ''; state.limit = 40; syncURL(); loadAtoms(); };
  $$('[data-unset]').forEach(b => b.onclick = () => {
    state[b.dataset.unset] = ''; state.limit = 40; renderSide(); syncURL(); loadAtoms();
  });
  const cf = $('#clear-flt');
  if (cf) cf.onclick = clearFilters;
}

function clearFilters(){
  state.q = state.project = state.tech = state.facet = state.kind = state.status = '';
  state.limit = 40;
  if (state.view !== 'atoms') state.view = 'atoms';
  renderSide(); syncURL(); loadAtoms();
}

// 「场景:项目开发」这样的 facet 参数，转为展示文案
function facetLabel(f){
  const i = f.indexOf(':');
  const dim = i < 0 ? f : f.slice(0, i);
  const value = i < 0 ? '' : f.slice(i + 1);
  return `${DIM_CN[dim] || dim}：${value}`;
}

// 作用域：global / project:xxx / tech:xxx
function scopeLabel(s){
  if (!s || s === 'global') return '全局';
  const i = s.indexOf(':');
  if (i < 0) return s;
  const k = s.slice(0, i), v = s.slice(i + 1);
  return (k === 'project' ? '项目 ' : k === 'tech' ? '技术 ' : k + ' ') + v;
}

function cardHTML(a){
  const tags = (a.facets||[]).slice(0, 8).map(f =>
    `<span class="chip" style="cursor:default">${esc(f.value)}</span>`).join('');
  const more = (a.facets||[]).length > 8 ? `<span class="kv">+${a.facets.length - 8}</span>` : '';
  const src = (a.sources||[]).map(s => `${s.source_kind}:${s.source_ref}`).slice(0,1).join('');
  const fb = a.feedback || {};
  // 摘要太短时退回正文前 400 字，保证卡片有足够上下文
  const preview = (a.summary && a.summary.length >= 120)
    ? a.summary : (a.body || '').slice(0, 400);
  const fbChip = fb.last ? `<span class="chip" style="cursor:default">${FB_CN[fb.last]||fb.last}</span>` : '';
  const fbCount = [fb.accepted && `采用 ${fb.accepted}`, fb.cited && `引用 ${fb.cited}`,
    fb.rejected && `不相关 ${fb.rejected}`].filter(Boolean).join(' · ');
  return `<div class="card" data-id="${a.atom_id}">
    <div class="meta">
      <span class="tag k-${a.kind}">${KIND_CN[a.kind]||a.kind}</span>
      <span class="score" title="综合评分">${(+a.score||0).toFixed(2)}</span>
      <span>${esc(scopeLabel(a.scope))}</span>
      ${a.sensitivity ? `<span class="sens sens-${a.sensitivity}">${SENS_CN[a.sensitivity]||a.sensitivity}</span>` : ''}
      ${a.state && a.state !== 'active' ? `<span class="chip" style="cursor:default">${STATE_CN[a.state]||a.state}</span>` : ''}
      ${fbChip}
    </div>
    <h3 class="card-title" data-act="detail">${esc(a.title)}</h3>
    <div class="body">${esc(preview)}</div>
    ${tags ? `<div class="taglist">${tags}${more}</div>` : ''}
    ${src ? `<div class="src" title="${esc(src)}">${esc(src)}</div>` : ''}
    ${fbCount ? `<div class="kv" style="margin-top:4px">反馈：${fbCount}</div>` : ''}
    <div class="acts">
      <button class="sm ghost" data-act="detail">详情</button>
      ${(a.state === 'dormant' || a.state === 'archived') ? '<button class="sm ok" data-act="restore">恢复</button>' : ''}
      <span style="flex:1"></span>
      <button class="sm ok ${fb.last === 'accepted' ? 'done' : ''}" data-ev="accepted">采用</button>
      <button class="sm ${fb.last === 'cited' ? 'done' : ''}" data-ev="cited">引用</button>
      <button class="sm no ${fb.last === 'rejected' ? 'done' : ''}" data-ev="rejected">不相关</button>
    </div>
  </div>`;
}
const SENS_CN = {public:'公开', internal:'内部', private:'私密'};
const SCORE_CN = {fts:'关键词/语义', importance:'重要性', confidence:'置信度',
  recency:'新鲜度', feedback:'反馈', trust:'可信度', vec_sim:'语义相似度'};

function fbSummary(fb){
  if (!fb) return '暂无';
  const parts = [fb.accepted && `采用 ${fb.accepted}`, fb.cited && `引用 ${fb.cited}`,
    fb.rejected && `不相关 ${fb.rejected}`, fb.verified && `核实 ${fb.verified}`,
    fb.corrected && `纠正 ${fb.corrected}`].filter(Boolean);
  return parts.length ? parts.join(' · ') : '暂无';
}

function bindCards(){
  $$('.cards .card').forEach(c => {
    const id = c.dataset.id;
    if (!id) return;
    c.querySelectorAll('[data-act=detail]').forEach(el => el.onclick = () => openDetail(id));
    const rb = c.querySelector('[data-act=restore]');
    if (rb) rb.onclick = e => {
      e.stopPropagation();
      withBusy(rb, '恢复中…', async () => {
        const r = await post('/api/atom/restore', {atom_id:id});
        if (r.error) return toast(r.error, 'error');
        toast(r.restored ? '已恢复，重新参与检索' : '该条当前无需恢复', r.restored ? 'ok' : 'warn');
        loadAtoms().catch(err => viewError(err, loadAtoms));
      });
    };
    c.querySelectorAll('[data-ev]').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      if (b.dataset.done) return;
      await withBusy(b, '记录中…', async () => {
        const ev = b.dataset.ev;
        const r = await post('/api/feedback', {atom_id:id, event:ev});
        if (r.error) return toast(r.error, 'error');
        // 就地更新这一张卡：按钮状态、反馈次数、降权/恢复徽章都不需要整页刷新
        const a = ATOMS.find(x => x.atom_id === id);
        if (a){
          a.feedback = a.feedback || {};
          a.feedback.last = ev;
          a.feedback[ev] = (a.feedback[ev] || 0) + 1;
          if (r.demoted) a.state = 'dormant';
          if (r.restored) a.state = 'active';
          c.outerHTML = cardHTML(a);
          bindCards();
        }
        if (r.restored) toast('该条已从「已降权」恢复，重新参与检索', 'ok');
        else if (r.demoted) toast('连续多次「不相关」，该条进入「已降权」；正常命中不足时仍会召回，可在「状态 → 已降权」恢复', 'warn');
        else if (ev === 'rejected'){
          const left = Math.max(0, (r.threshold || 2) - (r.reject_streak || 1));
          toast(left ? `已记录「不相关」（${r.reject_streak}/${r.threshold}）；再标记 ${left} 次将降权` : '已记录「不相关」', 'warn');
        } else {
          toast(ev === 'accepted' ? '已采用：后续检索会提高该条权重' : '已引用：后续检索会提高该条权重', 'ok');
        }
      });
    });
  });
}

function esc(s){ return String(s??'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

// ---------------- graph
const GTYPE_CN = {project:'项目', tech:'技术', concept:'概念', person:'人物',
  tool:'工具', file:'文件', org:'组织'};

async function loadGraph(focusId){
  const v = $('#view');
  v.innerHTML = `<div class="graph-wrap"><canvas id="graph"></canvas>
    <aside class="gp" id="gpanel" hidden></aside>
    <div class="legend">
      <div><span class="dot" style="background:#D99A5B"></span>项目</div>
      <div><span class="dot" style="background:#8FBF7A"></span>技术</div>
      <div><span class="dot" style="background:#B98FA8"></span>概念</div>
      <div style="margin-top:4px;color:var(--fg-4)">点击节点查看详情 · 拖拽平移 · 滚轮缩放</div>
    </div></div>`;
  // 带 around 时把目标节点的邻居一起拉进来，保证从详情里跳过去一定能定位到
  const g = await get('/api/graph?limit=90' + (focusId ? '&around=' + encodeURIComponent(focusId) : ''));
  if (g.error) return viewError(g.error, loadGraph);
  drawGraph(g, focusId);
}

function drawGraph(g, focusId){
  const cv = $('#graph'), ctx = cv.getContext('2d'), panel = $('#gpanel');
  const dpr = window.devicePixelRatio || 1;
  function resize(){
    const r = cv.parentElement.getBoundingClientRect();
    cv.width = r.width*dpr; cv.height = r.height*dpr;
    cv.style.width = r.width+'px'; cv.style.height = r.height+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  const W = () => cv.width/dpr, H = () => cv.height/dpr;
  const COLOR = {project:'#D99A5B', tech:'#8FBF7A', concept:'#B98FA8'};
  const light = isLight();
  const ACCENT = light ? '#A85E17' : '#E0A458';
  const EDGE = light ? {co_used:'rgba(90,120,60,.22)', default:'rgba(150,110,60,.24)'}
                     : {co_used:'rgba(143,191,122,.18)', default:'rgba(224,164,88,.24)'};
  const LABEL = light ? '#4B3F34' : '#D8CCC0';
  const FALLBACK = light ? '#9B8B7B' : '#A89A8C';
  const nodes = g.nodes.map((n,i) => ({
    ...n,
    x: W()/2 + Math.cos(i*2.399)*Math.min(W(),H())*0.32 + (Math.random()-.5)*60,
    y: H()/2 + Math.sin(i*2.399)*Math.min(W(),H())*0.32 + (Math.random()-.5)*60,
    vx:0, vy:0, r: 4 + Math.min(14, Math.sqrt(n.degree||1)*1.8)
  }));
  const idx = Object.fromEntries(nodes.map(n => [n.entity_id, n]));
  const edges = g.edges.filter(e => idx[e.src_id] && idx[e.dst_id]);
  let scale = 1, ox = 0, oy = 0, drag = null, down = null;
  let sel = null, nbrs = new Set(), focus = null, panelSeq = 0;

  function neighborsOf(n){
    const s = new Set();
    for (const e of edges){
      if (e.src_id === n.entity_id) s.add(e.dst_id);
      else if (e.dst_id === n.entity_id) s.add(e.src_id);
    }
    return s;
  }
  function hitTest(e){
    const r = cv.getBoundingClientRect();
    const mx = (e.clientX-r.left-ox)/scale, my = (e.clientY-r.top-oy)/scale;
    return nodes.find(n => (n.x-mx)**2 + (n.y-my)**2 < (n.r+6)**2) || null;
  }

  function tick(){
    // 斥力
    for (let i=0;i<nodes.length;i++){
      const a = nodes[i];
      for (let j=i+1;j<nodes.length;j++){
        const b = nodes[j];
        let dx = b.x-a.x, dy = b.y-a.y, d2 = dx*dx+dy*dy || 0.01;
        if (d2 > 90000) continue;
        const f = 1400/d2;
        const d = Math.sqrt(d2);
        dx/=d; dy/=d;
        a.vx -= dx*f; a.vy -= dy*f; b.vx += dx*f; b.vy += dy*f;
      }
    }
    // 弹簧
    for (const e of edges){
      const a = idx[e.src_id], b = idx[e.dst_id];
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.sqrt(dx*dx+dy*dy)||1;
      const target = 90 + 40/Math.log2(2+(e.weight||1));
      const f = (d-target)*0.0025;
      a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
    }
    // 向心 + 阻尼
    const cx = W()/2, cy = H()/2;
    for (const n of nodes){
      n.vx += (cx-n.x)*0.0009; n.vy += (cy-n.y)*0.0009;
      n.vx *= 0.88; n.vy *= 0.88;
      n.x += n.vx; n.y += n.vy;
    }
  }
  function paint(){
    ctx.clearRect(0,0,W(),H());
    ctx.save();
    ctx.translate(ox, oy); ctx.scale(scale, scale);
    for (const e of edges){
      const a = idx[e.src_id], b = idx[e.dst_id];
      const on = sel && (e.src_id === sel.entity_id || e.dst_id === sel.entity_id);
      ctx.globalAlpha = sel && !on ? 0.16 : 1;
      ctx.strokeStyle = on ? ACCENT : (e.rel === 'co_used' ? EDGE.co_used : EDGE.default);
      ctx.lineWidth = (on ? 1.7 : 0.8)/scale;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const n of nodes){
      const near = !sel || n === sel || nbrs.has(n.entity_id);
      ctx.globalAlpha = near ? 0.9 : 0.16;
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,7);
      ctx.fillStyle = COLOR[n.type] || FALLBACK;
      ctx.fill();
      if (n === sel){
        ctx.globalAlpha = 1;
        ctx.strokeStyle = ACCENT; ctx.lineWidth = 1.6/scale;
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r+3.5,0,7); ctx.stroke();
      }
      if (n === sel || (near && (scale > 0.7 || n.degree > 12))){
        ctx.globalAlpha = near ? 1 : 0.3;
        ctx.fillStyle = n === sel ? (light ? '#2A2119' : '#EFEFF1') : LABEL;
        ctx.font = `${(n === sel ? 12 : 11)/scale}px -apple-system,PingFang SC,sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(n.name.length>16 ? n.name.slice(0,15)+'…' : n.name, n.x, n.y - n.r - 4);
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  let raf;
  function loop(){
    for (let k=0;k<2;k++) tick();
    if (focus){
      // 反定位：把镜头平滑挪到目标节点，到位后停手
      const tx = W()/2 - focus.x*scale, ty = H()/2 - focus.y*scale;
      ox += (tx-ox)*0.2; oy += (ty-oy)*0.2;
      if (Math.abs(tx-ox) < 0.6 && Math.abs(ty-oy) < 0.6){ ox = tx; oy = ty; focus = null; }
    }
    paint(); raf = requestAnimationFrame(loop);
  }
  loop();

  // ---- 详情面板
  function bindClose(){
    const b = panel && panel.querySelector('.gp-close');
    if (b) b.onclick = clearSel;
  }
  function closePanel(){
    panelSeq++;
    if (panel){ panel.hidden = true; panel.innerHTML = ''; }
  }
  function clearSel(){ sel = null; nbrs = new Set(); closePanel(); }

  function renderPanel(d){
    const n = d.node, rels = d.relations || [], atoms = d.atoms || [];
    const facet = (d.facet && d.facet.dim) ? `${d.facet.dim}:${d.facet.value}` : '';
    panel.innerHTML = `
      <div class="gp-head"><span class="gp-type">${GTYPE_CN[n.type]||n.type}</span>
        <button class="gp-close" title="关闭（Esc）">✕</button></div>
      <h3>${esc(n.name)}</h3>
      <div class="kv">关联知识 <b>${n.atoms}</b> 条 · 关系 <b>${n.degree}</b> 条</div>
      <div class="gp-sec">关系</div>
      ${rels.length ? rels.map(r => `<button class="gp-rel" data-node="${esc(r.node_id)}"
          title="定位到「${esc(r.name)}」">
          <span class="dot" style="background:${COLOR[r.type]||FALLBACK}"></span>
          <span class="rel">${r.dir === 'out' ? esc(r.rel_cn)+' →' : '← '+esc(r.rel_cn)}</span>
          <span class="nm">${esc(r.name)}</span>
          ${r.weight > 1 ? `<span class="wt">${Math.round(r.weight)}</span>` : ''}
        </button>`).join('') : `<div class="kv">暂无关联节点</div>`}
      <div class="gp-sec">相关知识</div>
      ${atoms.length ? atoms.map(a => `<div class="gp-atom">
          <span class="tag k-${a.kind}">${KIND_CN[a.kind]||a.kind}</span>
          <span>${esc(a.title)}</span></div>`).join('')
        : `<div class="kv">这个节点下还没有知识</div>`}
      ${n.atoms ? `<button class="gp-more">在知识浏览中查看全部 ${n.atoms} 条</button>` : ''}`;
    bindClose();
    panel.querySelectorAll('.gp-rel').forEach(b => b.onclick = () => {
      const next = nodes.find(x => x.entity_id === b.dataset.node);
      if (next) selectNode(next, {center:true});
      else loadGraph(b.dataset.node);   // 不在当前子图里：重载并把它的邻居带进来
    });
    const more = panel.querySelector('.gp-more');
    if (more) more.onclick = () => {
      state.view = 'atoms'; state.q = ''; state.kind = '';
      state.project = ''; state.tech = ''; state.facet = facet; state.limit = 40;
      syncURL(); renderView();
    };
  }

  async function selectNode(n, opts={}){
    if (!n || !panel) return;
    sel = n; nbrs = neighborsOf(n);
    if (opts.center){
      focus = n;
      scale = Math.max(scale, 0.8);
    }
    const seq = ++panelSeq;
    panel.hidden = false;
    panel.innerHTML = `<div class="gp-head"><span class="gp-type">${GTYPE_CN[n.type]||n.type}</span>
      <button class="gp-close" title="关闭（Esc）">✕</button></div>
      <h3>${esc(n.name)}</h3><div class="kv">正在加载关联信息…</div>`;
    bindClose();
    const d = await get('/api/graph?node=' + encodeURIComponent(n.entity_id));
    if (seq !== panelSeq) return;
    if (d.error){
      panel.innerHTML = `<div class="gp-head"><span class="gp-type">${GTYPE_CN[n.type]||n.type}</span>
        <button class="gp-close" title="关闭（Esc）">✕</button></div>
        <h3>${esc(n.name)}</h3><div class="kv">${esc(d.error)}</div>`;
      bindClose(); return;
    }
    renderPanel(d);
  }

  cv.onmousedown = e => {
    const hit = hitTest(e);
    down = {x:e.clientX, y:e.clientY, node:hit, moved:false};
    drag = hit || {pan:true, sx:e.clientX, sy:e.clientY, ox, oy};
    cv.classList.add('grabbing');
  };
  cv.onmousemove = e => {
    if (!drag){ cv.classList.toggle('pointing', !!hitTest(e)); return; }
    if (down && Math.abs(e.clientX-down.x) + Math.abs(e.clientY-down.y) > 4) down.moved = true;
    if (drag.pan){ ox = drag.ox + (e.clientX-drag.sx); oy = drag.oy + (e.clientY-drag.sy); return; }
    const r = cv.getBoundingClientRect();
    drag.x = (e.clientX-r.left-ox)/scale; drag.y = (e.clientY-r.top-oy)/scale;
    drag.vx = drag.vy = 0;
  };
  const onUp = () => {
    cv.classList.remove('grabbing');
    if (down && !down.moved){
      if (down.node) selectNode(down.node);
      else clearSel();          // 点空白处收起详情
    }
    drag = null; down = null;
  };
  window.addEventListener('mouseup', onUp);
  cv.onwheel = e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const mx = e.clientX-r.left, my = e.clientY-r.top;
    const k = e.deltaY < 0 ? 1.1 : 0.91;
    scale = Math.min(3, Math.max(0.3, scale*k));
    ox = mx - (mx-ox)*k; oy = my - (my-oy)*k;
  };
  const onResize = () => resize();
  const onKey = e => { if (e.key === 'Escape' && sel) clearSel(); };
  window.addEventListener('resize', onResize);
  document.addEventListener('keydown', onKey);
  window._stopGraph = () => {
    cancelAnimationFrame(raf);
    window.removeEventListener('mouseup', onUp);
    window.removeEventListener('resize', onResize);
    document.removeEventListener('keydown', onKey);
  };

  const start = idx[focusId];
  if (start) selectNode(start, {center:true});
}

// ---------------- settings
async function waitWebUp(base, timeoutMs){
  // 重启期间面板必然连不上；用 no-cors 轮询只判断「端口是否已能响应」
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs){
    try {
      await fetch(base + '/api/health', {cache:'no-store', mode:'no-cors'});
      return true;
    } catch(e){ /* 还没起来 */ }
    await new Promise(r => setTimeout(r, 500));
  }
  return false;
}

async function loadSettings(){
  const [cfg, health] = await Promise.all([get('/api/config'), get('/api/health')]);
  const {saved, current, schema} = cfg;
  // 按 group 聚合，表单完全由后端 schema 驱动：新增配置项无需改前端
  const groups = new Map();
  for (const f of schema){
    if (!groups.has(f.group)) groups.set(f.group, []);
    groups.get(f.group).push(f);
  }
  const fmt = v => v == null ? '' : (Array.isArray(v) ? v.join('\n') : String(v));
  const ctl = f => {
    const v = fmt(current[f.key]);
    const savedRaw = saved[f.key];
    // 只有「保存过、但当前生效值不同」才提示；没保存过的默认值不该被标黄
    const overridden = !f.sensitive && savedRaw != null
      && JSON.stringify(savedRaw) !== JSON.stringify(current[f.key] ?? null);
    const tag = overridden
      ? ` <span class="pill warn" title="环境变量优先级高于面板保存值">环境变量覆盖</span>` : '';
    const hint = [f.hint, f.env ? `环境变量 <code>${esc(f.env)}</code>` : '']
      .filter(Boolean).join(' · ');
    const hintHtml = hint ? `<div class="cfg-hint">${hint}</div>` : '';
    const label = `<label class="cfg-label" for="cfg-${f.key}">${esc(f.label)}${tag}</label>`;
    if (f.type === 'bool'){
      return `<div class="cfg-field">${label}
        <div class="cfg-ctl"><input type="checkbox" id="cfg-${f.key}"
          data-key="${f.key}" ${current[f.key]?'checked':''}></div>${hintHtml}</div>`;
    }
    const ph = `跟随默认${v?`（当前 ${esc(v).slice(0,40)}）`:''}`;
    if (f.options){
      const opts = ['', ...f.options].map(o => {
        const txt = o ? esc((f.option_labels||{})[o] || o) : '跟随默认';
        return `<option value="${esc(o)}" ${fmt(current[f.key])===o?'selected':''}>${txt}</option>`;
      }).join('');
      return `<div class="cfg-field">${label}
        <div class="cfg-ctl"><select id="cfg-${f.key}" data-key="${f.key}">${opts}</select></div>${hintHtml}</div>`;
    }
    const wide = f.type === 'list' ? ' span2' : '';
    const input = f.type === 'list'
      ? `<textarea id="cfg-${f.key}" data-key="${f.key}" rows="3"
          placeholder="${esc(ph)}">${esc(v)}</textarea>`
      : `<input id="cfg-${f.key}" data-key="${f.key}"
          type="${(f.type==='int'||f.type==='float') ? 'number' : 'text'}"
          value="${f.sensitive?'':esc(v)}"
          placeholder="${f.sensitive && v ? '已设置（留空将清除）' : esc(ph)}">`;
    return `<div class="cfg-field${wide}">${label}
      <div class="cfg-ctl">${input}</div>${hintHtml}</div>`;
  };
  const groupHtml = [...groups].map(([g, fields]) => `
    <div class="cfg-group"><h3>${esc(g)}<span class="kv">${fields.length} 项</span></h3>
      <div class="cfg-fields">${fields.map(ctl).join('')}</div></div>`).join('');

  const curPort = Number(current['web.port'] || 8765);
  const runPort = Number(health.port || curPort);
  const stale = (health.code_stale || []).filter(p => p !== 'web/index.html');
  const notes = [];
  if (curPort !== runPort)
    notes.push(`<span style="color:var(--warn)">端口已改为 ${curPort}，重启后生效</span>`);
  if (stale.length)
    notes.push(`<span style="color:var(--warn)">服务端代码有更新，重启后生效</span>`);

  $('#view').innerHTML = `<h2>设置 <span class="tabs-hint">配置保存即写入 config.json；端口改动与面板代码更新需重启</span></h2>
    <div class="cfg-bar">
      <span id="cfg-out" class="kv">共 ${schema.length} 项配置 · 当前端口 ${runPort}</span>
      <span class="spacer"></span>
      ${notes.join('')}
      <button id="cfg-reset" class="ghost">撤销修改</button>
      <button class="primary" id="cfg-save">保存全部</button>
      <button id="cfg-restart" title="重启面板进程，使端口等改动生效">重启面板</button>
    </div>
    ${groupHtml}
    <div class="cfg-group"><h3>同步与连通测试</h3>
      <div class="kv" style="margin-bottom:10px">把高可信度的决策/偏好/教训单向同步到 mnemosyne。</div>
      <div class="acts"><button id="sync-preview">预览候选</button><button class="primary" id="sync-run">立即同步</button>
        <button id="llm-test">测试模型连通</button></div>
      <div id="sync-out" class="kv" style="margin-top:8px"></div>
    </div>`;

  // 有未保存改动时给出提示，避免直接关页面丢配置
  const markDirty = () => {
    const out = $('#cfg-out');
    if (out) out.innerHTML = '<span style="color:var(--warn)">有未保存的修改</span>';
  };
  $$('#view .cfg-fields input, #view .cfg-fields textarea, #view .cfg-fields select').forEach(
    el => { el.addEventListener('input', markDirty); el.addEventListener('change', markDirty); });

  $('#cfg-save').onclick = async e => {
    const values = {};
    $$('[data-key]').forEach(el => {
      const k = el.dataset.key;
      values[k] = el.type === 'checkbox' ? el.checked : el.value;
    });
    await withBusy(e.target, '保存中…', async () => {
      const r = await post('/api/config', {values});
      const errs = Object.entries(r.errors||{});
      if (errs.length){
        $('#cfg-out').innerHTML = `<span style="color:var(--bad)">${errs.map(([,m])=>esc(m)).join('；')}</span>`;
        toast('部分配置未通过校验，请查看提示', 'error');
        return;
      }
      const n = Object.keys(r.applied||{}).length;
      toast(`已保存 ${n} 项`, 'ok');
      const curPort = Number((r.applied||{})['web.port'] || 0);
      if (curPort && curPort !== Number(health.port)){
        $('#cfg-out').innerHTML = `<span style="color:var(--warn)">已保存 ${n} 项 · 端口改为 ${curPort}，重启后生效</span>`;
      } else {
        $('#cfg-out').innerHTML = `<span style="color:var(--ok)">已保存 ${n} 项</span>`;
        setTimeout(loadSettings, 600);
      }
    });
  };
  $('#cfg-reset').onclick = () => loadSettings();
  $('#cfg-restart').onclick = async e => {
    const dirty = ($('#cfg-out')?.textContent || '').includes('未保存');
    const ok = await confirmBox({
      title: '重启面板？',
      text: '面板进程就地重启，端口等设置立即生效；正在采集/归纳的后台任务会被中断。'
        + (dirty ? ' 当前还有未保存的修改，重启将丢弃。' : ''),
      ok: '重启'});
    if (!ok) return;
    await withBusy(e.target, '重启中…', async () => {
      const r = await post('/api/restart', {});
      if (r.error) return toast(r.error, 'error');
      const port = r.port || runPort;
      const base = `${location.protocol}//${location.hostname}:${port}`;
      toast('面板重启中，稍后自动刷新', 'warn');
      if (!await waitWebUp(base, 20000)){
        toast('重启后未能连接，请手动执行 minime web', 'error');
        return;
      }
      if (String(port) !== location.port) location.href = `${base}/?view=settings`;
      else location.reload();
    });
  };

  $('#llm-test').onclick = e => withBusy(e.target, '探测中…', async () => {
    const r = await get('/api/llm/health');
    $('#sync-out').innerHTML = r.ok
      ? `<span style="color:var(--ok)">连接正常</span> · 当前模型 <b>${esc(r.using)}</b> · 可用 ${(r.models||[]).length} 个`
      : `<span style="color:var(--bad)">连接失败</span> · ${esc(r.error)}`;
    toast(r.ok ? '模型连接正常' : '模型连接失败', r.ok ? 'ok' : 'error');
  });
  const showSync = (r, prefix) => {
    if (!r.preview) {
      $('#sync-out').innerHTML = `${prefix} · 已同步 <b>${r.synced??0}</b> · 失败 <b>${r.failed??0}</b>`
        + (r.skipped ? ` · ${esc(r.skipped)}` : '') + (r.error ? ` · ${esc(r.error)}` : '');
      return;
    }
    const rows = (r.preview||[]).map(c => `<div class="kv">· [${esc(KIND_CN[c.kind]||c.kind)}] ${esc(c.title)} <span class="kv">(可信层级 ${c.trust_tier} · 可靠度 ${c.veracity})</span></div>`).join('');
    $('#sync-out').innerHTML = `已同步 <b>${r.synced}</b> 条 · mnemosyne CLI ${r.cli?'可用':'缺失'}<br>`
      + (rows || '<div class="kv">暂无待同步候选</div>');
  };
  $('#sync-preview').onclick = async () => {
    $('#sync-out').textContent = '读取中…';
    showSync(await get('/api/sync'), '预览');
  };
  $('#sync-run').onclick = async () => {
    $('#sync-out').textContent = '同步中…';
    showSync(await post('/api/sync', {dry_run:false}), '完成');
  };
}
