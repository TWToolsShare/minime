          <div class="kv">${p.n_atoms} 条知识 · ${(p.collections||[]).length} 套知识集
            ${p.author?` · 作者 ${esc(p.author)}`:''} · ${fmtT(p.created_at)}
            ${p.origin?` · 来自 ${esc(p.origin)}`:''}</div>
        </div>
        <div class="acts">
          ${mine ? `<button class="sm" data-new-coll="${esc(p.pack_id)}">+ 新建知识集</button>` : ''}
          ${mine && p.pack_id !== 'P:self'
            ? `<button class="sm ghost" data-del-pack="${esc(p.pack_id)}" data-name="${esc(p.name)}">删除包</button>` : ''}
        </div>
      </div>
      <div class="pk-colls">${colls || '<div class="kv">还没有知识集</div>'}</div>
      ${mine ? '' : `<div class="kv" style="margin-top:6px;color:var(--warn)">他人导入的包只可使用，不可导出、不可编辑</div>`}
    </div>`;
  }).join('');

  const fileRows = files.map(f => `<tr>
    <td><b>${esc(f.name || f.file)}</b><div class="kv">${(f.size_kb).toFixed(0)} KB · ${f.atoms ?? '—'} 条 · ${esc(f.author||'匿名')} · ${fmtT(f.mtime)}</div></td>
    <td style="white-space:nowrap">
      <button class="sm ghost" data-inspect="${esc(f.file)}">查看</button>
      <a href="/api/pack/download?file=${encodeURIComponent(f.file)}"><button class="sm">下载</button></a>
      <button class="sm" data-import="${esc(f.file)}">重新导入</button>
      <button class="sm danger" data-delete="${esc(f.file)}">删除文件</button>
    </td></tr>`).join('');

  $('#view').innerHTML = `<h2>资源包 <span class="tabs-hint">已开启的知识集参与检索与对话；全部关闭时不限制检索范围</span><br>
    <span class="kv">一个资源包可包含多套知识集；自己的包可导出分享，他人导入的包仅可使用</span></h2>

    <div class="card">
      <h3>我的资源包 <span class="kv">敏感度分布：公开 ${sens.public||0} · 内部 ${sens.internal||0} · 私密 ${sens.private||0}</span></h3>
      <div class="pk-list">${packCards || '<div class="kv">还没有资源包</div>'}</div>
      <div class="acts" style="margin-top:12px">
        <input id="np-name" placeholder="资源包名称，如「架构方法论」" style="width:240px">
        <input id="np-author" placeholder="作者（可选）" style="width:150px">
        <button class="sm" id="np-go">+ 新建资源包</button>
      </div>
    </div>

    <div class="card">
      <h3>按条件筛出一套知识集 <span class="kv">设置筛选条件，预览命中结果后创建知识集</span></h3>
      <div class="pk-filter">
        <div class="cfg-row"><span class="cfg-label">目标包</span>
          <select id="fl-pack">${(pd.packs||[]).filter(p => p.owner==='self').map(p =>
            `<option value="${esc(p.pack_id)}">${esc(p.name)}</option>`).join('')}</select></div>
        <div class="cfg-row"><span class="cfg-label">知识集名称</span>
          <input id="fl-name" placeholder="如「docker 排障经验」"></div>
        <div class="cfg-row"><span class="cfg-label">关键词</span>
          <input id="fl-query" placeholder="标题或正文包含的关键词，可留空"></div>
        <div class="cfg-row"><span class="cfg-label">类型</span>
          <span class="pk-chips">${Object.entries(KIND_CN).map(([k,v]) =>
            `<label class="pk-chip"><input type="checkbox" class="fl-kind" value="${k}">${v}</label>`).join('')}</span></div>
        <div class="cfg-row"><span class="cfg-label">敏感度</span>
          <span class="pk-chips">${[['public','公开'],['internal','内部'],['private','私密']].map(([k,v]) =>
            `<label class="pk-chip"><input type="checkbox" class="fl-sens" value="${k}">${v}</label>`).join('')}</span></div>
        <div class="cfg-row"><span class="cfg-label">标签</span>
          <select id="fl-dim" style="width:110px"><option value="">（不限）</option></select>
          <select id="fl-value" style="width:200px"><option value="">请先选择维度</option></select></div>
        <div class="acts">
          <button class="sm" id="fl-preview">预览命中</button>
          <button class="sm primary" id="fl-create">创建知识集</button>
        </div>
      </div>
      <div id="fl-out" class="kv" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h3>导出 <span class="kv">只导出自己的包；他人导入的包不可导出</span></h3>
      <div class="cfg-row"><span class="cfg-label">导出哪个包</span>
        <select id="xp-pack">${(pd.packs||[]).filter(p => p.owner==='self').map(p =>
          `<option value="${esc(p.pack_id)}">${esc(p.name)}（${p.n_atoms} 条）</option>`).join('')}</select></div>
      <div class="cfg-row"><span class="cfg-label">包含哪些知识集</span>
        <span id="xp-colls" class="pk-chips"></span></div>
      <div class="cfg-row"><span class="cfg-label">文件名</span><input id="pack-name" placeholder="my-worker"></div>
      <div class="cfg-row"><span class="cfg-label">作者</span><input id="pack-author" placeholder="可选"></div>
      <div class="cfg-row" style="align-items:flex-start"><span class="cfg-label">属性</span>
        <div class="pk-attrs" id="xp-attrs">${attrGroups(pd.attrs||[])}</div></div>
      <label class="cfg-row"><span class="cfg-label">严格脱敏</span><input type="checkbox" id="pack-strict" checked></label>
      <label class="cfg-row"><span class="cfg-label">包含能力画像</span><input type="checkbox" id="pack-profile" checked></label>
      <label class="cfg-row"><span class="cfg-label">包含原始归档清单（谨慎）</span><input type="checkbox" id="pack-raw"></label>
      <div class="acts"><button class="primary" id="pack-export">导出资源包</button>
        <button id="pack-audit">重新体检</button></div>
      <div id="pack-out" class="kv" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h3>导入他人资源包 <span class="kv">上传后预览，确认后写入；导入后知识集默认关闭，可按需开启</span></h3>
      <div class="acts" style="margin-top:10px">
        <label class="primary" style="display:inline-flex;align-items:center;padding:6px 12px;
          border-radius:6px;cursor:pointer;font-size:12px">
          选择 .minime.zip 文件
          <input type="file" id="pack-file" accept=".zip" style="display:none">
        </label>
        <span class="kv" id="pack-upload-out"></span>
      </div>
      <div class="kv" style="margin-top:8px">也可以手动把包放进 <code>store/packs</code>，刷新即可看到。</div>
      ${fileRows ? `<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:10px">
        <thead><tr style="color:var(--fg-3);text-align:left;border-bottom:1px solid var(--line)">
          <th style="padding:6px 4px">包文件</th><th>操作</th></tr></thead>
        <tbody>${fileRows}</tbody></table>` : '<div class="kv" style="margin-top:6px">本地还没有包文件</div>'}
      <div id="pack-detail" class="kv" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h3>脱敏体检 <span class="kv">扫描 ${audit.atoms||0} 条知识 · 导出时按下面的处理方式自动处理</span></h3>
      <div style="margin-top:8px">${auditRows}</div>
      <div class="acts" style="margin-top:8px">
        <button class="sm ghost" id="sens-go">给新知识补判敏感度</button>
        <span id="sens-out" class="kv"></span>
      </div>
    </div>`;

  bindPacks(audit);
}

function attrGroups(attrs){
  const groups = [['core','核心内容'],['facet','标签'],['source','来源'],['meta','可信度与时间'],['usage','使用反馈']];
  const sensTag = p => p === 'sens'
    ? '<span class="pk-badge off" style="margin-left:6px">敏感</span>'
    : '<span class="pk-badge on" style="margin-left:6px">公开</span>';
  return groups.map(([g, label]) => {
    const items = attrs.filter(a => a.group === g);
    if (!items.length) return '';
    return `<div class="pk-attr-group"><div class="pk-attr-title">${label}</div>
      ${items.map(a => `<label class="pk-attr" title="不勾选时：${esc(a.when_off)}">
        <input type="checkbox" class="xp-attr" value="${a.key}" ${a.default?'checked':''}>
        <span>${esc(a.label)}${sensTag(a.privacy)}</span>
      </label>`).join('')}</div>`;
  }).join('');
}

function bindPacks(audit){
  const reload = () => loadPacks();

  $$('[data-coll]').forEach(el => el.onchange = async () => {
    const label = el.closest('.pk-coll')?.querySelector('.pk-coll-name')?.textContent || '知识集';
    const r = await post('/api/packs', {action:'enable', collection_id:el.dataset.coll,
      enabled:el.checked});
    if (r.error){ el.checked = !el.checked; return toast(r.error, 'error'); }
    // 就地更新徽章与提示，不整页重绘：开关的即时感来自「不用等刷新」
    const card = el.closest('.pk-card');
    if (card){
      const pack = (PACKDATA.packs||[]).find(p =>
        (p.collections||[]).some(c => c.collection_id === el.dataset.coll));
      if (pack){
        pack.collections.find(c => c.collection_id === el.dataset.coll).enabled = el.checked ? 1 : 0;
        pack.enabled_collections = pack.collections.filter(c => c.enabled).length;
        const badge = card.querySelector('.pk-badge.on, .pk-badge.off');
        if (badge){
          const on = pack.enabled_collections;
          badge.className = 'pk-badge ' + (on ? 'on' : 'off');
          badge.textContent = on ? `开启 ${on}/${pack.collections.length}` : '全部关闭';
        }
      }
    }
    const anyOn = (PACKDATA.packs||[]).some(p => (p.collections||[]).some(c => c.enabled));
    toast(`${el.checked ? '已开启' : '已关闭'}「${label}」`
      + (anyOn ? '' : '；当前无已开启知识集，检索不限制范围'), 'ok');
  });
  $$('[data-new-coll]').forEach(b => b.onclick = async () => {
    const name = await promptBox({title:'新建知识集', placeholder:'如「docker 排障经验」', ok:'创建'});
    if (!name) return;
    const r = await post('/api/packs', {action:'create_collection',
      pack_id:b.dataset.newColl, name});
    if (r.error) return toast(r.error, 'error');
    toast(`已创建知识集「${name}」（当前为空）；用下方筛选条件向其中添加内容`, 'ok');
    reload();
  });
  $$('[data-coll-drop]').forEach(b => b.onclick = async () => {
    const ok = await confirmBox({title:`移除知识集「${b.dataset.collTitle}」？`,
      text:'知识本身不会删除，仍保留在默认包里。', ok:'移除', danger:true});
    if (!ok) return;
    const r = await post('/api/packs', {action:'drop_collection',
      collection_id:b.dataset.collDrop});
    if (r.error) return toast(r.error, 'error');
    toast('已移除', 'ok');
    reload();
  });
  document.querySelectorAll('[data-del-pack]').forEach(b => b.onclick = async () => {
    const ok = await confirmBox({title:`删除资源包「${b.dataset.name}」？`,
      text:'知识本身保留在默认包里，只删除这个包的分组关系。', ok:'删除', danger:true});
    if (!ok) return;
    const r = await post('/api/packs', {action:'delete_pack', pack_id:b.dataset.delPack});
    if (r.error) return toast(r.error, 'error');
    toast('已删除资源包，知识仍在默认包里', 'ok');
    reload();
  });
  $$('[data-coll-view]').forEach(b => b.onclick = () => withBusy(b, '读取中…', async () => {
    const r = await post('/api/packs', {action:'collection_atoms', collection_id:b.dataset.collView});
    const items = r.items || [];
    $('#pack-detail').innerHTML = `<div class="card" style="margin-top:8px">
      <h3>${esc(b.dataset.collTitle)} <span class="kv">前 ${items.length} 条</span></h3>
      ${items.map(a => `<div class="kvrow"><span>${KIND_CN[a.kind]||a.kind} · ${esc(SENS_CN[a.sensitivity]||a.sensitivity||'')}</span>
        <span>${esc(a.title)} <span class="kv">${fmtT(a.created_at)}</span></span></div>`).join('') || '<div class="kv">空的</div>'}
    </div>`;
    $('#pack-detail').scrollIntoView({block:'nearest', behavior:'smooth'});
  }));

  // ---- 筛选建集
  const dims = ['project','tech','topic','scene','activity'];
  $('#fl-dim').innerHTML += dims.map(d => `<option value="${d}">${DIM_CN[d]||d}</option>`).join('');
  get('/api/facets').then(ft => {
    if ($('#fl-dim') === null) return;
    const fillVals = () => {
      const dim = $('#fl-dim').value;
      const vals = (ft[dim] || []).slice(0, 300);
      $('#fl-value').innerHTML = '<option value="">（不限）</option>' + vals.map(v =>
        `<option value="${esc(v.value)}">${esc(v.value)}（${v.count}）</option>`).join('');
    };
    $('#fl-dim').onchange = fillVals;
    $('#fl-dim').value = 'project';
    fillVals();
  });
  const collectFilter = () => ({
    query: $('#fl-query').value.trim(),
    kinds: $$('.fl-kind:checked').map(x => x.value),
    sensitivity: $$('.fl-sens:checked').map(x => x.value),
    facets: ($('#fl-dim').value && $('#fl-value').value)
      ? [{dim:$('#fl-dim').value, value:$('#fl-value').value}] : []});
  $('#fl-preview').onclick = async e => withBusy(e.target, '筛选中…', async () => {
    const r = await post('/api/packs', {action:'preview', filters:collectFilter()});
    if (r.error) return ($('#fl-out').innerHTML = `<span style="color:var(--bad)">${esc(r.error)}</span>`);
    const s = r.sensitivity || {};
    $('#fl-out').innerHTML = `<b>命中 ${r.total} 条</b>
      <span class="kv">公开 ${s.public||0} · 内部 ${s.internal||0} · 私密 ${s.private||0}</span>
      ${r.total ? `<div style="margin-top:6px">${(r.samples||[]).map(a => `<div>· ${KIND_CN[a.kind]||a.kind}
        ${esc(a.title)} <span class="kv">${esc(SENS_CN[a.sensitivity]||'')}</span></div>`).join('')}
        ${r.total > (r.samples||[]).length ? `<div class="kv">…只显示前 ${(r.samples||[]).length} 条</div>` : ''}</div>`
      : '<div class="kv" style="margin-top:6px">没有命中，放宽条件再试</div>'}`;
  });
  // 条件变化时清掉上一次的预览结果，避免拿旧数字建集
  $$('.fl-kind, .fl-sens').forEach(x => x.onchange = () => {
    if ($('#fl-out')) $('#fl-out').innerHTML = '';
  });
  $('#fl-name').oninput = () => { if ($('#fl-out')) $('#fl-out').innerHTML = ''; };
  $('#fl-create').onclick = async e => {
    const name = $('#fl-name').value.trim();
    if (!name){ $('#fl-name').focus(); return toast('请先填写知识集名称', 'warn'); }
    await withBusy(e.target, '创建中…', async () => {
      const r = await post('/api/packs', {action:'create_collection', pack_id:$('#fl-pack').value,
        name, filters:collectFilter()});
      if (r.error){ $('#fl-out').innerHTML = `<span style="color:var(--bad)">${esc(r.error)}</span>`; return; }
      toast(`已创建「${name}」，纳入 ${r.filled||0} 条`, 'ok');
      reload();
      setTimeout(() => {
        const el = $('#pack-hint'); if (el) el.textContent = `已创建「${name}」`;
      }, 300);
    });
  };

  $('#np-go').onclick = async e => {
    const name = $('#np-name').value.trim();
    if (!name){ $('#np-name').focus(); return toast('请先填写资源包名称', 'warn'); }
    await withBusy(e.target, '创建中…', async () => {
      const r = await post('/api/packs', {action:'create_pack', name,
        author:$('#np-author').value.trim()});
      if (r.error) return toast(r.error, 'error');
      toast(`已创建资源包「${name}」，接下来为它创建知识集`, 'ok');
      reload();
    });
  };

  // ---- 导出：选包 -> 刷新知识集与默认勾选
  const refreshColls = () => {
    const pid = $('#xp-pack').value;
    const p = (PACKDATA.packs||[]).find(x => x.pack_id === pid);
    const colls = p ? (p.collections||[]) : [];
    $('#xp-colls').innerHTML = colls.map(c => `<label class="pk-chip">
      <input type="checkbox" class="xp-coll" value="${esc(c.collection_id)}" checked>${esc(c.name)}（${c.n_atoms}）</label>`).join('')
      || '<span class="kv">该包还没有知识集</span>';
  };
  if ($('#xp-pack')) { $('#xp-pack').onchange = refreshColls; refreshColls(); }

  $('#pack-export').onclick = async e => {
    const pid = $('#xp-pack') ? $('#xp-pack').value : '';
    const colls = $$('.xp-coll:checked').map(x => x.value);
    if (!colls.length){ $('#xp-colls').scrollIntoView({block:'center'}); return toast('请至少选择一个知识集', 'warn'); }
    const attrs = {};
    $$('.xp-attr').forEach(x => attrs[x.value] = x.checked);
    const hidden = $$('.xp-attr:not(:checked)').length;
    if (hidden){
      const ok = await confirmBox({title:`有 ${hidden} 个属性未勾选`,
        text:'未勾选的敏感属性会在导出时被隐去或脱敏（例如来源引用、项目标签、精确时间）。',
        ok:'继续导出'});
      if (!ok) return;
    }
    await withBusy(e.target, '导出中…', async () => {
      const r = await post('/api/pack', {action:'export',
        name: $('#pack-name').value.trim() || 'my-worker',
        author: $('#pack-author').value.trim(),
        pack_id: pid, collections: colls, attrs,
        with_profile: $('#pack-profile').checked,
        loose: !$('#pack-strict').checked,
        include_raw: $('#pack-raw').checked});
      if (r.error){ $('#pack-out').innerHTML = `<span style="color:var(--bad)">${esc(r.error)}</span>`; return; }
      const pr = r.privacy || {};
      const residual = pr.residual_risk || [];
      $('#pack-out').innerHTML = `<span style="color:var(--ok)">已导出</span> · ${r.atoms} 条知识 · ${r.decisions} 条决策样例 · ${r.size_kb} KB
        · ${pr.strict ? '严格脱敏' : '基础脱敏'}
        ${residual.length ? `<br><span style="color:var(--warn)">! 仍有残留：${residual.map(esc).join('、')}；建议启用「严格脱敏」或取消勾选相关属性后重新导出</span>`
                          : `<br><span class="kv">自查通过：包内未发现路径/密钥/邮箱/手机号</span>`}
        ${(r.hidden_attrs||[]).length ? `<br><span class="kv">已隐去：${r.hidden_attrs.map(esc).join('、')}</span>` : ''}
        <br><a href="/api/pack/download?file=${encodeURIComponent(r.pack.split('/').pop())}"><button class="sm primary">下载这个包</button></a>`;
      toast('导出完成，可以下载了', 'ok');
      reload();
    });
  };
  $('#pack-audit').onclick = async () => { $('#pack-out').textContent = '体检中…'; reload(); };
  $('#sens-go').onclick = async () => {
    const r = await post('/api/packs', {action:'assign_sensitivity'});
    $('#sens-out').textContent = r.error ? r.error : `公开 ${r.public} · 内部 ${r.internal} · 私密 ${r.private}`;
  };

  // ---- 导入
  $('#pack-file').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    $('#pack-upload-out').textContent = `上传中…（${(f.size/1024).toFixed(0)} KB）`;
    const fd = new FormData();
    fd.append('file', f, f.name);
    const r = await fetch('/api/pack', {method:'POST', body:fd}).then(x => x.json())
      .catch(() => ({error: '上传中断，请重试'}));
    if (r.error || !r.file){
      $('#pack-upload-out').innerHTML = `<span style="color:var(--bad)">上传失败：${esc(r.error || '未知错误')}</span>`;
      return;
    }
    $('#pack-upload-out').innerHTML = `<span style="color:var(--ok)">已上传</span> ${esc(r.file)}`;
    await loadPacks();
    const pre = await post('/api/pack', {action:'inspect', file:r.file});
    if (pre.manifest) showPackPreview(r.file, pre.manifest, pre.size_kb);
    $('#pack-detail').scrollIntoView({block:'nearest', behavior:'smooth'});
  };
  $$('[data-inspect]').forEach(b => b.onclick = () => withBusy(b, '读取中…', async () => {
    const r = await post('/api/pack', {action:'inspect', file:b.dataset.inspect});
    if (r.error){ $('#pack-detail').innerHTML = `<span style="color:var(--bad)">${esc(r.error)}</span>`; return; }
    showPackPreview(b.dataset.inspect, r.manifest, r.size_kb);
    $('#pack-detail').scrollIntoView({block:'nearest', behavior:'smooth'});
  }));
  $$('[data-import]').forEach(b => b.onclick = () => importPackFlow(b.dataset.import));
  $$('[data-delete]').forEach(b => b.onclick = async () => {
    const ok = await confirmBox({title:`删除包文件「${b.dataset.delete}」？`,
      text:'只删本地 zip，已经导入的知识不受影响。', ok:'删除', danger:true});
    if (!ok) return;
    const r = await post('/api/pack', {action:'delete', file:b.dataset.delete});
    if (r.error) return toast(r.error, 'error');
    toast('已删除包文件', 'ok');
    reload();
  });
}

// 预览 -> 确认导入（导入后默认关闭）
function showPackPreview(file, m, sizeKb){
  const cov = m.coverage || {};
  const prv = m.privacy || {};
  const colls = m.collections || [];
  $('#pack-detail').innerHTML = `<div class="card" style="margin-top:8px">
    <h3>包预览：${esc(m.name || file)}</h3>

async function importPackFlow(file){
  const el = $('#imp-enable');
  const enable = el ? el.checked : false;
  const btn = $('#imp-go');
  await withBusy(btn, '导入中…', async () => {
    const pre = await post('/api/pack', {action:'import', file, dry_run:true});
    if (pre.error){ $('#pack-detail').innerHTML = `<span style="color:var(--bad)">${esc(pre.error)}</span>`; return; }
    const ok = await confirmBox({
      title: `导入「${pre.pack}」？`,
      text: `${pre.atoms} 条知识、${(pre.collections||[]).length} 套知识集。导入后${enable ? '立即开启' : '默认关闭（可稍后开启）'}，成为独立的「他人导入」资源包。`,
      ok: '导入'});
    if (!ok) return;
    const r = await post('/api/pack', {action:'import', file, dry_run:false, enable});
    if (r.error){
      $('#pack-detail').innerHTML = `<span style="color:var(--bad)">${esc(r.error)}</span>`;
      return toast(r.error, 'error');
    }
    toast(`导入完成，新增 ${r.imported} 条`, 'ok');
    $('#pack-detail').innerHTML = `<span style="color:var(--ok)">导入完成</span> · 新增 ${r.imported} 条 · 全库 ${r.total_atoms} 条
       <div style="margin-top:8px">资源包列表已出现「${esc(r.pack)}」，开启需要使用的知识集即可。</div>`;
    loadStats();
    loadPacks();
  });
}

// ---------------- logs（运行日志）
async function loadLogs(){
  const level = state.logLevel || 'all';
  const d = await get(`/api/logs?level=${level}&limit=200&q=${encodeURIComponent(state.logQ||'')}`);
  const rows = (d.items||[]).map(r => {
    const color = r.level === 'error' ? 'var(--bad)' : r.level === 'warn' ? 'var(--warn)' : 'var(--ok)';
    const t = new Date((r.ts||0)*1000).toLocaleString('zh-CN');
    const brief = Object.entries(r).filter(([k]) => !['id','ts','level','event'].includes(k))
      .map(([k,v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' · ').slice(0, 160);
    return `<tr data-log="${esc(r.id)}" class="logrow">
      <td style="padding:5px 4px;color:${color}">● ${LV_CN[r.level]||r.level}</td>
      <td><b>${esc(r.event)}</b><div class="kv">${esc(brief)}</div></td>
      <td class="kv" style="white-space:nowrap">${t}</td></tr>`;
  }).join('');
  const lv = (state.logLevel || 'all');
  $('#view').innerHTML = `<h2>运行日志 <span class="tabs-hint">排查问题时优先查看；「错误」筛选可定位失败操作</span><br><span class="kv">${d.stats.entries} 条（错误 ${d.stats.errors}） ·
    只记录业务动作和采集结果，面板轮询不写入</span></h2>
    <div class="acts" style="margin-bottom:10px">
      <span class="seg">${['all','info','warn','error'].map(l => `<button data-level="${l}" class="${lv===l?'on':''}">${
        l==='all'?'全部':l==='info'?'普通':l==='warn'?'警告':'错误'}</button>`).join('')}</span>
      <input type="text" id="log-q" placeholder="按事件名/内容过滤，回车生效" value="${esc(state.logQ||'')}"
        style="width:280px">
      <button id="log-refresh">刷新</button>
      <span class="kv" style="margin-left:10px">文件 ${esc(d.stats.path)} · 上限 ${d.stats.max} 条</span>
    </div>
    <div class="card" style="padding:0">${rows ? `<table style="width:100%;border-collapse:collapse;font-size:12px">${rows}</table>`
      : `<div class="empty">没有匹配的日志。执行采集或保存设置后会生成记录。</div>`}</div>
    <pre id="log-detail" class="kv" style="display:none;white-space:pre-wrap;margin-top:10px"></pre>`;
  document.querySelectorAll('[data-level]').forEach(b => b.onclick = () => {
    state.logLevel = b.dataset.level; loadLogs();
  });
  const q = $('#log-q');
  if (q) q.onkeydown = e => {
    if (e.key === 'Enter'){ state.logQ = q.value.trim(); loadLogs(); }
  };
  if (q) q.onkeyup = e => {
    // keydown 时输入法/回车可能还没提交，keyup 再兜一次，避免「要按两次」
    if (e.key === 'Enter' && state.logQ !== q.value.trim()){
      state.logQ = q.value.trim(); loadLogs();
    }
  };
  $('#log-refresh').onclick = loadLogs;
  document.querySelectorAll('[data-log]').forEach(tr => tr.onclick = async () => {
    const r = await get('/api/log?id=' + encodeURIComponent(tr.dataset.log));

}

const PROMPTS = ['我有哪些架构决策？', '这个项目踩过什么坑？', '我在 macOS 兼容上有什么约定？', '总结我的技术偏好'];

        <span class="kv" id="chat-meta">${esc(d.model || '')}</span>

        <button class="sm ghost" id="chat-rename">重命名</button>
      </div>
      <div class="chat-body" id="chat-body"></div>
      <div class="chat-foot">

  renderChatSessions();

    syncURL();

    if (!t) return;

    $('#chat-ttl').textContent = t; loadChatListOnly();
  };

async function loadChatListOnly(){
  const d = await get('/api/chat');
  CHAT.sessions = d.sessions || [];
  renderChatSessions();
}

function renderChatSessions(){
  const el = $('#chat-sess');
  if (!el) return;
  el.innerHTML = CHAT.sessions.length ? CHAT.sessions.map(s => `
    <div class="chat-item ${s.id === CHAT.sid ? 'on' : ''}" data-sid="${esc(s.id)}">
      <span class="t" title="${esc(s.title)}">${esc(s.title)}</span>
      <button class="del" data-del="${esc(s.id)}" title="删除">×</button>
    </div>`).join('') : `<div class="kv" style="padding:8px">还没有对话</div>`;
  el.querySelectorAll('[data-sid]').forEach(it => it.onclick = e => {
    if (e.target.dataset.del) return;
    if (CHAT.busy) return toast('正在回答，本轮结束后可切换会话', 'warn');
    CHAT.sid = it.dataset.sid; syncURL(); openChat(CHAT.sid);
    renderChatSessions();
  });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const ok = await confirmBox({title:'删除这段对话？', text:'聊天记录会一并删除，知识库不受影响。',
      ok:'删除', danger:true});
    if (!ok) return;
    const r = await post('/api/chat', {action:'delete', session_id:b.dataset.del});
    if (r.error) return toast(r.error, 'error');
    if (CHAT.sid === b.dataset.del) CHAT.sid = '';
    await loadChatListOnly();
    if (!CHAT.sid) openChat(''); else renderChatSessions();
  });
}

async function openChat(sid){
  const body = $('#chat-body');
  if (!body) return;
  if (!sid){
    body.innerHTML = `<div class="chat-empty">
      <div style="font-size:15px;color:var(--fg)">向知识库提问</div>
      <div style="font-size:12px">回答仅依据已采集的知识，并标注来源；点击来源可查看原文。</div>
      <div class="prompts">${PROMPTS.map(p => `<button class="sm" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>
    </div>`;
    body.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      $('#chat-q').value = b.dataset.p; sendChat();
    });
    $('#chat-ttl').textContent = '新对话';
    return;
  }
  const s = await get('/api/chat?id=' + encodeURIComponent(sid));
  if (s.error){ body.innerHTML = `<div class="empty">${esc(s.error)}</div>`; return; }
  CHAT.sid = s.id;
  $('#chat-ttl').textContent = s.title;
  $('#chat-meta').textContent = `${s.model || ''} · ${s.n_turns} 轮`;
  body.innerHTML = s.messages.map(m => msgHTML(m)).join('');
  bindRefs(body);
  body.scrollTop = body.scrollHeight;
}

// 对话正文轻量 Markdown：模型输出里的 **粗体**、`代码`、- 列表、[n] 引用标记
function mdLite(text){
  let h = esc(text);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/^#{1,4}\s+(.+)$/gm, '<div class="md-h">$1</div>');
  h = h.replace(/^[-*]\s+(.+)$/gm, '<div class="md-li">$1</div>');
  h = h.replace(/^\d+\.\s+(.+)$/gm, '<div class="md-li md-ol">$1</div>');
  h = h.replace(/\[\d+\]/g, m => `<span class="md-cite">${m}</span>`);
  return h;
}

function msgHTML(m){
  const isUser = m.role === 'user';
  const refs = (m.refs || []).map((r, i) => `<div class="ref" data-atom="${esc(r.atom_id)}">
      <span class="n">[${i+1}]</span><span>${mdLite(r.title)}</span></div>`).join('');
  const content = isUser ? esc(m.content) : mdLite(m.content);
  return `<div class="msg ${isUser ? 'user' : 'assistant'}">
    <div class="avatar">${isUser ? '你' : '分身'}</div>
    <div class="bubble"><div class="text">${content}</div>
      ${refs ? `<div class="refs">${refs}</div>` : ''}
      ${m.elapsed_s ? `<div class="kv" style="margin-top:6px">${m.elapsed_s}s</div>` : ''}
    </div></div>`;
}

function bindRefs(root){
  root.querySelectorAll('.ref').forEach(el => el.onclick = () => showAtom(el.dataset.atom));
}

// 对话里的来源点击 -> 复用知识详情抽屉
async function showAtom(atomId){
  const d = await get('/api/atoms?limit=200');
  const a = (d.items || []).find(x => x.atom_id === atomId);
  if (a){ ATOMS = [a]; openDetail(atomId); return; }
  // 不在前 200 条里就直接按标题搜一次
  const r = await get('/api/chat?id=' + encodeURIComponent(CHAT.sid));
  const ref = ((r.messages || []).flatMap(m => m.refs || []).find(x => x.atom_id === atomId));
  if (ref){
    const hit = await get('/api/atoms?q=' + encodeURIComponent(ref.title) + '&limit=5');
    const found = (hit.items || []).find(x => x.atom_id === atomId) || (hit.items || [])[0];
    if (found){ ATOMS = [found]; openDetail(found.atom_id); }
  }
}

async function sendChat(){
  const q = $('#chat-q');
  const text = q.value.trim();
  if (!text) return;
  if (CHAT.busy) return toast('上一轮回答尚未结束，请稍后', 'warn');
  const body = $('#chat-body');
  if (!CHAT.sid){
    const r = await post('/api/chat', {action:'new'});
    if (r.error || !r.session_id) return toast(r.error || '新建对话失败', 'error');
    CHAT.sid = r.session_id;
    body.innerHTML = '';
    syncURL();
  }
  CHAT.busy = true;
  q.value = ''; q.style.height = 'auto';
  const send = $('#chat-send');
  send.disabled = true; send.textContent = '思考中…';
  body.insertAdjacentHTML('beforeend', msgHTML({role:'user', content:text}));
  const pending = document.createElement('div');
  pending.className = 'msg assistant';
  pending.innerHTML = `<div class="avatar">分身</div><div class="bubble">
    <div class="typing"><i></i><i></i><i></i> 正在检索知识并生成回答…</div></div>`;
  body.appendChild(pending);
  body.scrollTop = body.scrollHeight;

  const r = await post('/api/chat', {action:'ask', session_id:CHAT.sid, question:text});
  pending.remove();
  if (r.error){
    body.insertAdjacentHTML('beforeend', `<div class="msg assistant"><div class="avatar">分身</div>
      <div class="bubble"><div class="text" style="color:var(--bad)">回答失败：${esc(r.error)}</div>
      <div class="acts" style="margin-top:8px"><button class="sm" id="retry-ask">重新提问</button></div></div></div>`);
    const rb = $('#retry-ask');
    if (rb) rb.onclick = () => { q.value = text; sendChat(); };
  } else {
    body.insertAdjacentHTML('beforeend', msgHTML(r));
    bindRefs(body);
  }
  body.scrollTop = body.scrollHeight;
  CHAT.busy = false;
  send.disabled = false; send.textContent = '发送';
  q.focus();
  const s = await get('/api/chat?id=' + encodeURIComponent(CHAT.sid));
  if (!s.error){
    $('#chat-ttl').textContent = s.title;
    $('#chat-meta').textContent = `${s.model || ''} · ${s.n_turns} 轮`;
  }
  loadChatListOnly();
}

  $('nav').classList.toggle('more-open', open);
  $('#nav-more-btn').setAttribute('aria-expanded', String(open));
  $('#nav-more-t').textContent = open ? '收起' : '更多';
  // 只记住用户主动的展开/收起；进到次要页时的自动展开不写入偏好
  if (remember) try { localStorage.setItem('navMore', open ? '1' : '0'); } catch(e){ /* 隐私模式忽略 */ }
}
$('#nav-more-btn').onclick = () => setNavMore(!$('nav').classList.contains('more-open'), true);

function renderView(){
  if (window._stopGraph) { window._stopGraph(); window._stopGraph = null; }
  closeDrawers();
  document.body.classList.toggle('chat-mode', state.view === 'chat');
  // 当前页在次要项里时自动展开，避免「看不到自己在哪一页」
  if (NAV_MORE.has(state.view)) setNavMore(true);
  $$('nav button[data-view]').forEach(b => {
    const on = b.dataset.view === state.view;
    b.classList.toggle('on', on);
    b.setAttribute('aria-current', on ? 'page' : 'false');
  });
  // 窄屏时导航可横向滚动，把当前项滚进可见区
  $('nav button[data-view].on')?.scrollIntoView({block:'nearest', inline:'nearest'});
  renderSide();
  $('#view').scrollTop = 0;
  routeView();
}

$$('nav button[data-view]').forEach(b => b.onclick = () => {
  if (state.view === b.dataset.view) return;
  state.view = b.dataset.view;
  syncURL();
  renderView();
});

// ---------------- 抽屉：统一开关、Esc 关闭、焦点归还
let _drawerFocus = null;
function closeDrawers(){
  $$('.drawer').forEach(d => d.remove());
  if (_drawerFocus && document.contains(_drawerFocus)) _drawerFocus.focus();
  _drawerFocus = null;
}
function openDrawer(el){
  closeDrawers();
  _drawerFocus = document.activeElement;
  document.body.appendChild(el);
  el.querySelector('.close')?.focus();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $$('.drawer').length){ closeDrawers(); }
});

// ---------------- 帮助：面板内一页说明，避免第一次打开不知道干什么
const GUIDE_STEPS = [
  ['① 处理进度', '按「采集 → 清洗 → 归纳」顺序执行；卡片会显示当前进度和下一步操作。'],
  ['② 对话', '基于知识库回答问题，并以 [1][2] 标注来源；点击来源可查看原文。同一会话支持连续追问，左侧为历史会话。'],
  ['③ 知识浏览', '查看具体知识条目；左侧分组可折叠筛选。「采用 / 引用 / 不相关」会调整后续检索权重，连续不相关只降权，可在「状态」中恢复。'],
  ['④ 知识图谱', '展示知识实体及其关系。点击节点可查看详情与关联节点，点击关联项可跳转并居中定位。'],
  ['⑤ 采集源', '查看各数据源状态；异常时行内会给出处理建议。'],
  ['⑥ 设置', '配置采集目录、模型、定时周期与语义过滤等参数。'],
];
function showHelp(){
  closeDrawers();
  const d = document.createElement('div');
  d.className = 'drawer';
  d.innerHTML = `<button class="close" title="关闭（Esc）">✕</button>
    <h3>minime 怎么用</h3>
    <div class="kv" style="margin-bottom:14px">将工作轨迹采集为可检索、可对话的个人知识库。</div>
    ${GUIDE_STEPS.map(([t, v]) => `<div class="kvrow" style="grid-template-columns:88px 1fr;margin-bottom:12px">
      <span style="color:var(--acc)">${t}</span><span style="line-height:1.75">${v}</span></div>`).join('')}
    <h3 style="font-size:12px;margin:18px 0 8px">常用命令</h3>
    <pre style="font-size:11px;line-height:1.9;color:var(--acc)">minime web                 打开这个面板（最常用）
minime status              一眼看全：采集 / 归纳 / 定时 / 服务
minime llm --run 20        后台归纳一批
minime llm --all           归纳全部待处理轮次
minime chat "问题"         命令行问一句
minime doctor              自检，逐项告诉你哪里不对
minime diag                导出脱敏诊断包（反馈问题时用）</pre>
    <div class="kv" style="margin-top:14px">完整说明见仓库 <code>docs/使用手册.md</code></div>`;
  document.body.appendChild(d);
  d.querySelector('.close').onclick = () => d.remove();
  d.querySelector('.close').focus();
}
$('#help-btn').onclick = showHelp;
$('#theme-btn').onclick = () => setTheme(!isLight());

(async () => {
  readURL();
  syncThemeBtn();
  let navSaved = null;
  try { navSaved = localStorage.getItem('navMore'); } catch(e){ /* 隐私模式忽略 */ }
  setNavMore(navSaved === '1' || NAV_MORE.has(state.view));
  FACETS = await get('/api/facets');
  loadStats();
  pollJobs();
  // 首次进入：知识库为空时直接引导到「处理进度」，避免看到空白页不知所措
  if (!(await get('/api/stats')).atoms && !location.search) state.view = 'progress';
  renderView();
})();
</script>
